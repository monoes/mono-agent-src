<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MonoAgent Storybook Onboarding</title>
<style>
:root{
  --paper:oklch(96.5% 0.018 85);
  --paper-2:oklch(92.5% 0.032 80);
  --paper-3:oklch(89% 0.04 78);
  --card:oklch(98.8% 0.008 85);
  --white:oklch(99.3% 0.005 85);
  --ink:oklch(25% 0.035 45);
  --ink-2:oklch(42% 0.03 50);
  --line:oklch(84% 0.03 70);
  --terra:oklch(62% 0.14 40);
  --terra-d:oklch(49% 0.13 37);
  --terra-l:oklch(91% 0.045 45);
  --teal:oklch(46% 0.075 200);
  --teal-d:oklch(36% 0.065 205);
  --teal-l:oklch(90% 0.035 195);
  --mustard:oklch(81% 0.14 83);
  --mustard-d:oklch(50% 0.1 72);
  --mustard-l:oklch(93.5% 0.06 88);
  --sage:oklch(80% 0.06 140);
  --sage-d:oklch(70% 0.07 140);
  --sky:oklch(91% 0.035 215);
  --fur:oklch(52% 0.08 55);
  --fur-d:oklch(41% 0.07 50);
  --face:oklch(86% 0.05 65);
  --font:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:var(--font);color:var(--ink);background:var(--paper);
  background-image:radial-gradient(oklch(88% 0.03 75 / .35) 1px,transparent 1.2px);
  background-size:22px 22px;-webkit-font-smoothing:antialiased;
}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px;border-radius:10px}
h1:focus{outline:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
code,.code{font-family:var(--mono);font-size:.92em;background:var(--paper-2);padding:2px 7px;border-radius:7px;color:var(--ink)}

/* SVG colour classes (classes, not var() in attributes, for WebKit safety) */
.fu{fill:var(--fur)}.fd{fill:var(--fur-d)}.ff{fill:var(--face)}.fi{fill:var(--ink)}.fi2{fill:var(--ink-2)}
.ft{fill:var(--terra)}.ftd{fill:var(--terra-d)}.ftl{fill:var(--terra-l)}
.fq{fill:var(--teal)}.fqd{fill:var(--teal-d)}.fql{fill:var(--teal-l)}
.fm{fill:var(--mustard)}.fmd{fill:var(--mustard-d)}.fml{fill:var(--mustard-l)}
.fs{fill:var(--sage)}.fsd{fill:var(--sage-d)}.fk{fill:var(--sky)}.fl{fill:var(--line)}
.fp{fill:var(--paper)}.fp2{fill:var(--paper-2)}.fc{fill:var(--card)}.fw{fill:var(--white)}
.ski{stroke:var(--ink)}.sku{stroke:var(--fur)}.skd{stroke:var(--fur-d)}.skq{stroke:var(--teal)}
.skt{stroke:var(--terra)}.skm{stroke:var(--mustard-d)}.skl{stroke:var(--line)}.skp{stroke:var(--paper)}
.skw{stroke:var(--white)}.ski2{stroke:var(--ink)}
.ico .skw,.ico .ski2{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg text{font-family:var(--font);font-weight:700}

/* layout */
.app{height:100vh;display:grid;grid-template-rows:auto 1fr;min-height:560px}
header.top{display:flex;align-items:center;gap:22px;padding:14px 36px 4px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:17px;letter-spacing:-.01em;flex:none}
.brand svg{width:34px;height:28px}
.trail{flex:1;display:flex;list-style:none;margin:0;padding:0 0 4px;min-width:0}
.stop{flex:1 1 0;display:flex;flex-direction:column;align-items:center;position:relative;min-width:0}
.conn{position:absolute;top:12px;left:-50%;width:100%;height:12px;z-index:0;overflow:visible}
.conn path{fill:none;stroke:var(--line);stroke-width:3;stroke-dasharray:1 7;stroke-linecap:round}
.conn.done path{stroke:var(--teal);stroke-dasharray:none}
.conn.skipped path{stroke:var(--mustard-d);stroke-dasharray:7 6;stroke-linecap:butt}
.dot{position:relative;z-index:1;margin-top:3px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  background:var(--card);border:2.5px solid var(--line);color:var(--ink-2);font-weight:800;font-size:13px;
  transition:transform .4s var(--ease)}
.dot svg{display:block}
.stop.done .dot{background:var(--teal);border-color:var(--teal);color:var(--white)}
.stop.skipped .dot{background:var(--mustard-l);border:2.5px dashed var(--mustard-d);color:var(--mustard-d)}
.stop.cur .dot{margin-top:0;width:36px;height:36px;background:var(--terra-l);border:3px solid var(--terra-d);
  box-shadow:0 0 0 5px oklch(91% 0.045 45 / .7)}
.lab{margin-top:5px;font-size:11.5px;font-weight:650;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;padding:0 2px}
.stop.cur .lab{color:var(--terra-d);font-weight:800;overflow:visible}
.stop.skipped .lab{color:var(--mustard-d)}
.stop.skipped .lab::after{content:"skipped";display:block;font-size:10.5px;font-weight:600;text-align:center}
@media (max-width:1180px){.stop:not(.cur) .lab{visibility:hidden}}

.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;padding:12px 36px 26px;min-height:0}
.stage[data-key="done"]{grid-template-columns:minmax(0,.72fr) minmax(0,1.28fr)}
@media (max-width:1100px){.stage{gap:26px;padding:10px 22px 20px;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr)}}
.art{position:relative;border-radius:34px;background:var(--paper-2);overflow:hidden;min-height:0;
  box-shadow:inset 0 0 0 2px oklch(86% 0.035 75 / .6);
  background-image:radial-gradient(circle at 20% 15%,oklch(95% 0.03 85) 0,transparent 45%),radial-gradient(circle at 85% 90%,oklch(90% 0.04 75) 0,transparent 40%)}
.art>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.art.enter>svg{animation:artIn .7s var(--ease) both}
@keyframes artIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.pane{display:flex;flex-direction:column;min-height:0;min-width:0}
.pane-body{flex:1;overflow:auto;padding:6px 8px 18px 4px;min-height:0}
.pane.enter .pane-body>*{animation:rise .6s var(--ease) both}
.pane.enter .pane-body>*:nth-child(2){animation-delay:.04s}
.pane.enter .pane-body>*:nth-child(3){animation-delay:.08s}
.pane.enter .pane-body>*:nth-child(n+4){animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.pop{animation:rise .5s var(--ease) both}

.eyebrow{margin:6px 0 4px;font-size:13.5px;font-weight:800;color:var(--terra-d);letter-spacing:.02em}
h1{margin:0;font-size:clamp(28px,2.7vw,38px);line-height:1.1;letter-spacing:-.015em;font-weight:850;text-wrap:balance}
.lead{font-size:17px;line-height:1.55;color:var(--ink-2);max-width:56ch;margin:10px 0 18px}
p{line-height:1.5}
h2{font-size:15px;margin:22px 0 10px;font-weight:800}
.small{font-size:14px;color:var(--ink-2);line-height:1.45}

.nav{display:flex;align-items:center;gap:12px;padding-top:14px;border-top:2px dashed var(--line);flex:none}
.nav .grow{flex:1}
.nav-hint{font-size:13.5px;color:var(--ink-2);min-width:0;flex:0 1 auto;text-align:right}
.btn{font-weight:750;font-size:16px;border-radius:999px;padding:11px 22px;border:2px solid transparent;cursor:pointer;
  transition:transform .15s var(--ease),box-shadow .15s var(--ease),background-color .2s;white-space:nowrap;line-height:1.2}
.btn-primary{background:var(--terra-d);color:var(--white);box-shadow:0 4px 0 oklch(38% 0.1 35)}
.btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 0 oklch(38% 0.1 35)}
.btn-primary:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 oklch(38% 0.1 35)}
.btn:disabled{background:var(--paper-3);color:oklch(48% 0.03 50);box-shadow:none;cursor:not-allowed;border-color:transparent}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover:not(:disabled){background:var(--card)}
.btn-ghost:disabled{background:transparent;opacity:.45}
.btn-soft{background:var(--teal-l);color:var(--teal-d);font-size:14.5px;padding:8px 16px}
.btn-soft:hover:not(:disabled){background:oklch(86% 0.045 195)}
.btn-sm{font-size:14px;padding:7px 14px}
.link{white-space:nowrap;background:none;border:none;color:var(--teal-d);font-weight:750;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:6px 4px;font-size:15px}
.link:hover{color:var(--teal)}

.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px 16px}
.list-plain{list-style:none;margin:0;padding:0}

/* welcome list */
.setup-list{display:grid;gap:10px;margin:6px 0 0;padding:0;list-style:none}
.setup-list li{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:650}
.bubble{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.bubble svg{width:22px;height:22px}

/* rows */
.row{display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:18px;background:var(--card);border:2px solid var(--line);margin-bottom:10px}
.row.ok{border-color:oklch(80% 0.05 195)}
.row .meta{flex:1;min-width:0}
.row .name{font-weight:750;font-size:16px}
.row .desc{font-size:13.5px;color:var(--ink-2);margin-top:2px;line-height:1.4}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-size:13.5px;font-weight:750;white-space:nowrap}
.pill.ok{background:var(--teal-l);color:var(--teal-d)}
.pill.warn{background:var(--mustard-l);color:var(--mustard-d)}
.pill.busy{background:var(--paper-2);color:var(--ink-2)}
.pill.skip{background:var(--mustard-l);color:var(--mustard-d);border:1.5px dashed var(--mustard-d)}
.pill.no{background:var(--terra-l);color:var(--terra-d)}
.status-ico{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--paper-2)}
.row.ok .status-ico{background:var(--teal)}
.spin{width:16px;height:16px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--terra-d);animation:spin .9s linear infinite;display:inline-block;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}

/* fields */
.field{display:grid;gap:7px;margin-bottom:16px}
.field>label,.field>.flabel{font-weight:750;font-size:14.5px}
.input{font-size:16px;padding:11px 14px;border-radius:14px;border:2px solid var(--line);background:var(--white);color:var(--ink);width:100%}
.input:focus{border-color:var(--teal);outline:none;box-shadow:0 0 0 4px oklch(90% 0.035 195)}
.input[aria-invalid="true"]{border-color:var(--terra-d)}
.err{color:var(--terra-d);font-weight:700;font-size:14px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:999px;border:2px solid var(--line);background:var(--card);padding:6px 14px;font-weight:650;font-size:14.5px;cursor:pointer}
.chip:hover{border-color:var(--teal)}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--white)}
.chip-hint{font-size:13px;color:var(--ink-2);align-self:center;margin-right:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.avatars{display:flex;flex-wrap:wrap;gap:8px}
.av{width:44px;height:44px;border-radius:50%;border:3px solid transparent;display:grid;place-items:center;cursor:pointer;padding:0;
  box-shadow:0 0 0 2px var(--paper);transition:transform .2s var(--ease)}
.av:hover{transform:translateY(-2px)}
.av[aria-checked="true"]{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--terra-d)}
.av svg{width:24px;height:24px}
.folder{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.preview{display:flex;gap:14px;align-items:stretch;margin-top:4px}
.sidebar-mock{width:230px;background:var(--paper-2);border-radius:16px;padding:12px;border:2px solid var(--line)}
.sidebar-mock .cap{font-size:11.5px;font-weight:800;color:var(--ink-2);letter-spacing:.06em;text-transform:uppercase;margin:0 0 8px 4px}
.side-item{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:8px 10px;border:2px solid oklch(80% 0.05 195)}
.side-item .av-s{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
.side-item .av-s svg{width:18px;height:18px}
.side-item .nm{font-weight:750;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.side-item .nm.ph{color:var(--ink-2);font-style:italic;font-weight:600}
.side-ghost{height:12px;border-radius:6px;background:var(--paper-3);margin:9px 6px 0;width:60%}

.pointer{display:flex;gap:10px;align-items:center;background:var(--mustard-l);border-radius:14px;padding:10px 14px;font-size:14.5px;margin-top:18px;line-height:1.4}
.pointer svg{flex:none;width:22px;height:22px}

/* explainer cards */
.explain{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:4px 0 16px}
.explain .card{padding:12px 14px 14px}
.explain svg{width:100%;height:auto;display:block;background:var(--paper-2);border-radius:12px;margin-bottom:10px}
.explain h3{margin:0 0 4px;font-size:15.5px}
.explain p{margin:0;font-size:14px;color:var(--ink-2)}
.progress{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:8px}
.progress li{display:flex;gap:10px;align-items:center;font-size:15px;color:var(--ink-2)}
.progress li.now{color:var(--ink);font-weight:700}
.progress li.did{color:var(--teal-d);font-weight:650}
.tick{width:20px;height:20px;border-radius:50%;background:var(--teal);display:grid;place-items:center;flex:none}
.wait{width:20px;height:20px;border-radius:50%;border:2.5px dashed var(--line);flex:none}
.success{display:flex;gap:12px;align-items:center;background:var(--teal-l);color:var(--teal-d);border-radius:16px;padding:12px 16px;font-weight:750;margin-top:14px}

/* agents */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;position:relative}
.tile.ready{border-color:oklch(78% 0.06 195)}
.tile .tname{font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px}
.tile .tname svg{width:22px;height:22px;flex:none}
.tile .pill{align-self:flex-start}
.tile .hint{font-size:13.5px;color:var(--ink-2);line-height:1.4;margin:0}
.tile .reco{position:absolute;top:-11px;right:12px;background:var(--terra-d);color:var(--white);font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px}
.tile .act{margin-top:auto;display:flex;gap:8px;align-items:center}
.sim{display:inline-flex;align-items:center;gap:8px;border:2px dashed var(--line);border-radius:12px;padding:6px 12px;font-size:13.5px;font-weight:700;color:var(--ink-2);background:transparent;cursor:pointer;margin-bottom:14px}
.sim[aria-pressed="true"]{border-color:var(--terra-d);color:var(--terra-d);background:var(--terra-l)}
.sim .box{width:16px;height:16px;border-radius:5px;border:2px solid currentColor;display:grid;place-items:center}
.empty{background:var(--terra-l);border-radius:16px;padding:12px 16px;margin-bottom:14px;font-weight:700;color:var(--terra-d)}
.empty span{display:block;font-weight:600;color:var(--ink);font-size:14.5px;margin-top:3px}

/* browser sub-stepper */
.substeps{display:flex;gap:6px;list-style:none;margin:0 0 16px;padding:0;flex-wrap:wrap}
.substeps button{display:flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px 5px 5px;font-size:13.5px;font-weight:700;color:var(--ink-2);cursor:pointer}
.substeps button:disabled{cursor:default;opacity:.6}
.substeps .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--paper-2);font-weight:800;font-size:12.5px}
.substeps .now button{border-color:var(--terra-d);color:var(--ink)}
.substeps .now .n{background:var(--terra-d);color:var(--white)}
.substeps .did .n{background:var(--teal);color:var(--white)}
.pickers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pick{display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;border:2px solid var(--line);background:var(--card);cursor:pointer;font-weight:750;font-size:16px;text-align:left}
.pick[aria-pressed="true"]{border-color:var(--teal);background:var(--teal-l);color:var(--teal-d)}
.pick svg{width:36px;height:36px;flex:none}
.howto{list-style:none;margin:0;padding:0;display:grid;gap:10px;counter-reset:h}
.howto li{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.howto li.did{border-color:oklch(80% 0.05 195)}
.howto .num{width:28px;height:28px;border-radius:50%;background:var(--terra-d);color:var(--white);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.howto li.did .num{background:var(--teal)}
.howto .body{flex:1;min-width:0}
.howto .t{font-weight:750}
.howto .s{font-size:13.5px;color:var(--ink-2);margin:3px 0 8px}
.howto .acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.radios{display:grid;gap:8px}
.radio{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;border:2px solid var(--line);background:var(--card);cursor:pointer;font-weight:700}
.radio:has(input:checked){border-color:var(--teal);background:var(--teal-l)}
.radio input{width:18px;height:18px;accent-color:var(--teal);margin:0}
.radio .sub{font-weight:600;font-size:13px;color:var(--ink-2);margin-left:auto}
.diagram{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;gap:6px;margin-top:16px}
.dbox{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center;font-size:13px;color:var(--ink-2);min-height:74px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.dbox b{color:var(--ink);font-size:14px;overflow-wrap:anywhere}
.dbox.on{border-color:var(--teal)}
.darrow{width:30px;height:16px}
.sites{display:flex;justify-content:center;gap:4px}
.sites i{width:14px;height:14px;border-radius:50%;display:block}

/* permissions */
.perm{display:flex;align-items:center;gap:14px;justify-content:space-between;padding:12px 14px;border-radius:16px;background:var(--card);border:2px solid var(--line);margin-bottom:10px;flex-wrap:wrap}
.perm .pname{font-weight:750;font-size:16px}
.seg{display:inline-flex;background:var(--paper-2);border-radius:999px;padding:4px;gap:2px;border:0;margin:0}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{display:block;border-radius:999px;padding:7px 13px;font-weight:750;font-size:14px;color:var(--ink-2);transition:background-color .2s}
.seg input:focus-visible+span{outline:3px solid var(--teal);outline-offset:2px}
.seg input:checked+span.allow{background:var(--teal);color:var(--white)}
.seg input:checked+span.ask{background:var(--mustard);color:var(--ink)}
.seg input:checked+span.never{background:var(--terra-d);color:var(--white)}
.queue{display:flex;gap:14px;align-items:center;margin-top:16px;background:var(--teal-l);border-radius:16px;padding:12px 16px;color:var(--teal-d);font-weight:650;line-height:1.45}
.queue svg{flex:none;width:40px;height:40px}

/* first run */
.runs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.runcard{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:14px;border-radius:18px;border:2px solid var(--line);background:var(--card);cursor:pointer;text-align:left;font-weight:750;font-size:15px;line-height:1.3}
.runcard:hover:not(:disabled){border-color:var(--teal);transform:translateY(-2px)}
.runcard{transition:transform .2s var(--ease)}
.runcard[aria-pressed="true"]{border-color:var(--terra-d);background:var(--terra-l)}
.runcard:disabled{cursor:not-allowed;opacity:.6}
.runcard svg{width:30px;height:30px}
.flow{display:flex;align-items:center;margin:18px 0 8px;flex-wrap:wrap;gap:4px 0}
.node{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:9px 11px;font-size:13.5px;font-weight:700;color:var(--ink-2);display:flex;gap:7px;align-items:center;transition:background-color .3s}
.node .nn{width:20px;height:20px;border-radius:50%;background:var(--paper-2);display:grid;place-items:center;font-size:11.5px;font-weight:800}
.node.lit{background:var(--teal);border-color:var(--teal);color:var(--white)}
.node.lit .nn{background:var(--white);color:var(--teal-d)}
.node.now{border-color:var(--mustard-d);background:var(--mustard-l);color:var(--ink)}
.node.now .nn{background:var(--mustard)}
.node.flash{animation:flash .6s var(--ease)}
@keyframes flash{0%{transform:scale(.94)}60%{transform:scale(1.05)}100%{transform:none}}
.wire{width:20px;height:3px;background:var(--line);border-radius:2px}
.wire.lit{background:var(--teal)}
.runstatus{font-size:15px;color:var(--ink-2);display:flex;gap:8px;align-items:center;min-height:24px}
.result{margin-top:12px;background:var(--card);border:2px solid oklch(80% 0.05 195);border-radius:18px;padding:14px 16px}
.result h3{margin:0 0 6px;font-size:15.5px}
.result p{margin:0 0 6px;font-size:15px}
.result .note{font-size:12.5px;color:var(--ink-2);margin:0}

/* finish */
.summary{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}
.summary li{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1.5px dashed var(--line);font-weight:650;font-size:15px}
.summary .sname{flex:1;min-width:0}
.summary .dotx{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none}
.summary .dotx.done{background:var(--teal)}
.summary .dotx.skipped{background:var(--mustard-l);border:2px dashed var(--mustard-d)}
.summary .link{font-size:13.5px;padding:2px}
.catalogue{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.cat{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px}
.cat .ct{display:flex;align-items:center;gap:9px;font-weight:800;font-size:15px}
.cat .ci{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none}
.cat .ci svg{width:19px;height:19px}
.cat p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.4}
.cat .where{font-size:12px;font-weight:750;color:var(--teal-d);margin-top:auto}

/* mockup control */
.mock{position:fixed;left:14px;bottom:14px;z-index:50;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.mock-btn{background:var(--ink);color:var(--paper);border:none;border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:800;letter-spacing:.04em;cursor:pointer;box-shadow:0 4px 14px oklch(25% 0.035 45 / .25)}
.mock-panel{background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:12px;width:260px;box-shadow:0 10px 30px oklch(25% 0.035 45 / .2)}
.mock-panel[hidden]{display:none}
.mock-panel .cap{font-size:12px;font-weight:800;color:var(--ink-2);margin:0 0 8px;text-transform:uppercase;letter-spacing:.06em}
.mock-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.mock-grid button{border:1.5px solid var(--line);background:var(--paper);border-radius:9px;padding:5px 8px;font-size:12.5px;font-weight:700;text-align:left;cursor:pointer}
.mock-grid button[aria-current="true"]{border-color:var(--terra-d);background:var(--terra-l)}
.mock-reset{margin-top:8px;width:100%;border:none;background:var(--terra-d);color:var(--white);border-radius:9px;padding:7px;font-weight:800;font-size:13px;cursor:pointer}
.mock-note{font-size:11.5px;color:var(--ink-2);margin:8px 0 0;line-height:1.35}

/* end overlay */
.end{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:oklch(96.5% 0.018 85 / .9)}
.end[hidden]{display:none}
.end .card{max-width:440px;text-align:center;padding:26px 28px;animation:rise .6s var(--ease) both}
.end svg{width:130px;height:130px}
.end h2{font-size:24px;margin:6px 0}

/* SVG motion */
.bob{animation:bob 3.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.drift{animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(18px)}}
.floaty{animation:floaty 4.5s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-5px)}}
.jump{animation:jump 1.4s var(--ease) infinite}
@keyframes jump{0%,100%{transform:none}40%{transform:translateY(-14px)}}
.fall{animation:fall 3.5s linear infinite}
@keyframes fall{from{transform:translateY(-30px);opacity:0}15%{opacity:1}to{transform:translateY(110px);opacity:0}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
@media (max-width:1100px){.runs{grid-template-columns:1fr}.tiles{grid-template-columns:1fr}.explain{grid-template-columns:1fr}.summary{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.preview{flex-direction:column}.sidebar-mock{width:100%}}
</style>

<div class="app">
  <header class="top">
    <div class="brand" id="brand"></div>
    <ol class="trail" id="trail" aria-label="Setup progress"></ol>
  </header>
  <main class="stage" id="stage">
    <div class="art" id="art" aria-hidden="false"></div>

</div>

<div class="mock" id="mock">

    <button class="mock-reset" data-act="mock-reset">Reset the flow</button>

  </div>
  <button class="mock-btn" id="mock-btn" data-act="mock-toggle" aria-expanded="false" aria-controls="mock-panel">Mockup</button>
</div>

<div class="end" id="end" hidden>

  'br-open': function(){ S.br.open = true; render(); },
  'br-dev': function(){ S.br.dev = true; render(); },
  'br-load': function(){ S.br.load = true; render(); },
  'br-copy': function(){
    var text = '~/.monoagent/extension';
    try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).catch(function(){}); } catch(e){}
    S.br.copied = true; render();
    later(function(){ S.br.copied = false; render(); }, 1800);
  },
  'br-pair': function(){
    if (S.br.pair !== 'idle') return;
    S.br.pair = 'waiting'; render();
    later(function(){ S.br.pair = 'ok'; render(); var b = $('b-brnext2'); if (b && key()==='browser') b.focus(); }, 2800);
  },
  run: function(arg){
    if (S.run.phase === 'running' || !RUNS[arg]) return;
    S.run = {choice:arg, phase:'running', lit:0}; render();
    [1,2,3].forEach(function(n){ later(function(){ S.run.lit = n; render(); }, n*850); });
    later(function(){ S.run.phase = 'done'; S.run.lit = 4; render(); }, 3400);
  },
  'mock-toggle': function(){
    var p = $('mock-panel'), b = $('mock-btn'); p.hidden = !p.hidden; b.setAttribute('aria-expanded', String(!p.hidden));
  },
  'mock-go': function(arg){ S.finished = false; go(+arg); },
  'mock-reset': function(){
    clearTimers(); S = fresh(); lastKey = null; lastArt = '';
    $('mock-panel').hidden = true; $('mock-btn').setAttribute('aria-expanded','false');
    render(); onEnter();
    var t = $('step-title'); if (t) t.focus({preventScroll:true});
  }
};

/* ---------- events ---------- */
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  if (el.tagName === 'A') e.preventDefault();
  var fn = ACTS[el.getAttribute('data-act')];
  if (fn) fn(el.getAttribute('data-arg'), el);
});
document.addEventListener('input', function(e){
  var t = e.target, m = t.getAttribute && t.getAttribute('data-model');
  if (!m) return;
  var parts = m.split('.'); S[parts[0]][parts[1]] = t.value;
  if (m === 'profile.name') S.profile.touched = true;
  refreshLive();
});
document.addEventListener('change', function(e){
  var t = e.target;
  if (t.name && t.name.indexOf('perm-') === 0){ S.perm[t.name.slice(5)] = t.value; render(); }
  else if (t.name === 'bprof'){ S.br.bprof = +t.value; render(); }
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape'){ var p = $('mock-panel'); if (!p.hidden){ ACTS['mock-toggle'](); $('mock-btn').focus(); } return; }
  if (e.key !== 'Enter' || e.isComposing || e.shiftKey || e.metaKey || e.ctrlKey || e.altKey) return;
  var t = e.target;
  if (t.closest && t.closest('button, a, summary, textarea, select, .mock')) return;
  if (S.finished) return;
  if (key()==='profile' && !validName()){ S.profile.touched = true; refreshLive(); return; }
  if (canContinue(S.step)){ e.preventDefault(); next(); }
});

/* ---------- boot ---------- */
$('brand').innerHTML = miniFace(34,26) + '<span>MonoAgent</span>';
$('mock-grid').innerHTML = STEPS.map(function(st, i){ return '<button data-act="mock-go" data-arg="'+i+'">'+(i+1)+'. '+esc(st.label)+'</button>'; }).join('');
$('end-art').innerHTML = '<svg viewBox="0 0 160 160" aria-hidden="true"><circle cx="80" cy="84" r="70" class="fml"/>'+monkey({x:80,y:150,s:.95,armR:160,armL:160,mouth:'open',eyes:'happy',hat:'party',anim:'jump'})+'</svg>';
S = fresh();
render(); onEnter();

/* test hook (mockup only) */
window.__mock = {S:function(){ return S; }, ACTS:ACTS, go:go, canContinue:canContinue, render:render};
})();
</script>
</body>
</html>
