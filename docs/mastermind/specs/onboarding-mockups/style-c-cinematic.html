<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MonoAgent Onboarding: Cinematic</title>
<style>
:root{
  --bg: oklch(0.14 0.045 285);
  --ink: oklch(0.97 0.01 290);
  --ink-2: oklch(0.84 0.02 290);
  --ink-3: oklch(0.72 0.03 290);
  --accent: oklch(0.83 0.15 72);
  --accent-2: oklch(0.72 0.17 55);
  --accent-ink: oklch(0.22 0.05 60);
  --accent-soft: oklch(0.83 0.15 72 / 0.16);
  --ok: oklch(0.82 0.14 158);
  --ok-soft: oklch(0.82 0.14 158 / 0.14);
  --skip: oklch(0.76 0.10 12);
  --err: oklch(0.78 0.13 25);
  --glass: oklch(0.16 0.04 288 / 0.84);
  --glass-2: oklch(0.24 0.045 288 / 0.72);
  --line: oklch(0.97 0.01 290 / 0.14);
  --line-2: oklch(0.97 0.01 290 / 0.26);
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}

/* ---------- World backdrop ---------- */
:root{--pl:28px;--pw:clamp(400px,37vw,540px)}
#world{position:fixed;inset:0;width:100%;height:100%;display:block}
#stars{transition:opacity 3s var(--ease)}
body.dawn #stars{opacity:.25}
#dawn{opacity:0;transition:opacity 3s var(--ease)}
body.dawn #dawn{opacity:1}
#sunG{transform:translateY(260px);transition:transform 4s var(--ease)}
body.dawn #sunG{transform:none}
#warmSky,#warmV{transition:opacity 2.4s var(--ease)}
.twinkle{animation:tw 5s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.drift{animation:drift 40s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-40px)}to{transform:translateX(40px)}}
#village{position:fixed;right:0;bottom:0;top:84px;left:calc(var(--pl) + var(--pw) - 90px);width:auto;height:auto;z-index:1;pointer-events:none}
#village svg{width:100%;height:100%;display:block;overflow:visible}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:1;background:
  linear-gradient(90deg, oklch(0.11 0.04 285 / 0.55) 0%, oklch(0.11 0.04 285 / 0.12) 40%, transparent 55%),
  radial-gradient(140% 100% at 70% 80%, transparent 50%, oklch(0.09 0.04 285 / 0.5) 100%)}

/* plots: hidden, planned (current step), ghost (skipped), built */
.plot{display:none}
.plot.built,.plot.ghost,.plot.plan{display:inline}
.plot.ghost *,.plot.plan *{fill:none !important;stroke-width:1.3px !important;stroke-dasharray:3 4 !important;animation:none !important;filter:none !important}
.plot.ghost *{stroke:oklch(0.82 0.03 290 / .5) !important}
.plot.plan *{stroke:oklch(0.86 0.15 75 / .95) !important}
.plot.plan{animation:planPulse 2.4s ease-in-out infinite}
@keyframes planPulse{0%,100%{opacity:.55}50%{opacity:1}}
.plot.ghost .fx,.plot.plan .fx{display:none}
.plot.built .pc{transform-box:fill-box;transform-origin:50% 100%;animation:rise 1.1s var(--ease) both;animation-delay:calc(var(--i,0) * 170ms)}
@keyframes rise{0%{opacity:0;transform:translateY(26px) scaleY(.2)}60%{opacity:1}100%{opacity:1;transform:none}}
.plot.built .burst{transform-box:fill-box;transform-origin:center;animation:burst 1.4s ease-out both}
@keyframes burst{0%{opacity:.9;transform:scale(.2)}100%{opacity:0;transform:scale(3.2)}}
.burst{opacity:0}

/* ambient life */
.spin{transform-box:fill-box;transform-origin:center;animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.flick{transform-box:fill-box;transform-origin:50% 100%;animation:flick .9s ease-in-out infinite alternate}
.flick.b{animation-duration:.7s;animation-delay:-.3s}
@keyframes flick{0%{transform:scale(1,1)}50%{transform:scale(.88,1.12)}100%{transform:scale(1.06,.92)}}
.glowp{animation:glowp 2.2s ease-in-out infinite}
@keyframes glowp{0%,100%{opacity:.7}50%{opacity:1}}
.spark{animation:spark 2.4s linear infinite;opacity:0}
@keyframes spark{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}100%{opacity:0;transform:translate(var(--sx,6px),-70px)}}
.smoke{animation:smoke 5s linear infinite;opacity:0}
@keyframes smoke{0%{opacity:0;transform:translate(0,0) scale(.6)}20%{opacity:.5}100%{opacity:0;transform:translate(18px,-60px) scale(1.8)}}
.water{animation:water 3s linear infinite}
@keyframes water{to{stroke-dashoffset:-40}}
.bulb{animation:tw 3s ease-in-out infinite}
.bird{animation:bird 26s linear infinite}
@keyframes bird{from{transform:translate(-120px,20px)}to{transform:translate(1000px,-40px)}}

/* walkers: mover slides along the lane, facer flips at each end, legs and arms swing */
.mover{animation:walkx var(--t,24s) linear infinite;animation-delay:var(--dl,0s)}
@keyframes walkx{0%{transform:translate(0,0)}50%{transform:translate(var(--d),var(--dy,0px))}100%{transform:translate(0,0)}}
.facer{transform-box:fill-box;transform-origin:center;animation:face var(--t,24s) steps(1,end) infinite;animation-delay:var(--dl,0s)}
@keyframes face{0%{transform:scaleX(1)}50%{transform:scaleX(-1)}100%{transform:scaleX(-1)}}
.leg,.arm{transform-box:fill-box;transform-origin:50% 0;animation:swing .5s ease-in-out infinite alternate}
.leg.b,.arm.a{animation-delay:-.5s}
.robo .leg{animation-duration:.36s;--sw:18deg}
.robo .leg.b{animation-delay:-.36s}
@keyframes swing{from{transform:rotate(var(--sw,26deg))}to{transform:rotate(calc(var(--sw,26deg) * -1))}}
.bob{animation:bob .25s ease-in-out infinite alternate}
.robo .bob{animation-duration:.18s}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-1.2px)}}
.blink{animation:blink 2s steps(1,end) infinite}
@keyframes blink{0%,70%{opacity:1}71%,100%{opacity:.2}}

/* the tag over the plot that the current step builds */
#planTag{transition:transform .9s var(--ease),opacity .5s}
#planTag text{font:600 13px var(--font);fill:oklch(0.96 0.02 85)}
#planTag rect{fill:oklch(0.14 0.04 288 / .9);stroke:var(--accent)}

/* ---------- Chrome ---------- */
.app{position:relative;z-index:2;height:100%;display:grid;grid-template-rows:auto 1fr;padding:18px 28px 22px}
.top{display:flex;align-items:center;gap:22px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.brand svg{width:30px;height:30px}
.brand small{display:block;font-weight:500;color:var(--ink-3);font-size:12px;letter-spacing:.02em}

/* constellation progress */
.journey{flex:1;min-width:0;position:relative}
.journey ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(10,1fr);position:relative}
.journey .wire{position:absolute;left:5%;right:5%;top:15px;height:2px;background:linear-gradient(90deg,var(--line-2),var(--line));border-radius:2px}
.journey .wire i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--accent-2),var(--accent));border-radius:2px;box-shadow:0 0 12px var(--accent);transition:width 1.2s var(--ease)}
.journey li{display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.star{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:oklch(0.16 0.04 288 / .9);border:1px solid var(--line-2);color:var(--ink-3);font-size:12px;font-weight:650;cursor:default;padding:0;position:relative;transition:all .5s var(--ease)}
.star svg{width:14px;height:14px}
li.done .star{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 18px oklch(0.83 0.15 72 / .55)}
li.skipped .star{background:oklch(0.16 0.04 288 / .9);border:1.5px dashed var(--skip);color:var(--skip)}
li.current .star{background:var(--ink);color:var(--bg);border-color:var(--ink);box-shadow:0 0 0 6px oklch(0.97 0.01 290 / .12),0 0 26px oklch(0.97 0.01 290 / .45)}
li.current .star::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:1px solid oklch(0.97 0.01 290 / .35);animation:ring 2.8s var(--ease) infinite}
@keyframes ring{from{transform:scale(.8);opacity:1}to{transform:scale(1.35);opacity:0}}
.journey .lbl{font-size:11.5px;color:var(--ink-3);text-align:center;line-height:1.2;max-width:96px}
li.current .lbl{color:var(--ink);font-weight:600}
li.done .lbl{color:var(--ink-2)}
li.skipped .lbl{color:var(--skip)}
.journey .lbl em{display:block;font-style:normal;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.9}

/* ---------- Stage ---------- */
.stage{display:flex;align-items:center;min-height:0;padding-top:14px}
.panel{position:relative;background:var(--glass);border:1px solid var(--line);border-radius:26px;box-shadow:0 40px 120px oklch(0.05 0.03 285 / .65), inset 0 1px 0 oklch(0.97 0.01 290 / .08);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);display:flex;flex-direction:column;max-height:calc(100vh - 140px);min-height:0}
.panel{width:var(--pw)}
.panel-body{padding:34px 38px 18px;overflow:auto;min-height:0}
.panel-foot{display:flex;align-items:center;gap:10px;padding:16px 26px 20px 38px;border-top:1px solid var(--line)}
.panel-foot .sp{flex:1}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:650;margin:0 0 10px}
h1:focus{outline:none}
h1{font-size:clamp(30px,3.3vw,44px);line-height:1.06;letter-spacing:-.025em;margin:0 0 14px;font-weight:680;text-wrap:balance}
h2{font-size:16px;margin:0 0 6px;font-weight:650;letter-spacing:-.005em}
.lead{font-size:17px;color:var(--ink-2);margin:0 0 22px;max-width:52ch;text-wrap:pretty}
p{margin:0 0 12px}
.muted{color:var(--ink-3)}
.pointer{display:flex;gap:8px;align-items:center;margin-top:18px;font-size:13.5px;color:var(--ink-2);padding:10px 14px;border-radius:12px;background:oklch(0.97 0.01 290 / .05);border:1px solid var(--line)}
.pointer svg{width:16px;height:16px;flex:none;color:var(--accent)}
code{font-family:var(--mono);font-size:13px;background:oklch(0.97 0.01 290 / .08);padding:2px 6px;border-radius:6px}

.scene-in{animation:sceneIn .9s var(--ease) both}
@keyframes sceneIn{from{opacity:0;transform:translateY(18px) scale(.985);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}

/* ---------- Controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:999px;border:1px solid var(--line-2);background:oklch(0.97 0.01 290 / .06);color:var(--ink);font-weight:600;cursor:pointer;transition:background .25s var(--ease),transform .25s var(--ease),opacity .25s}
.btn:hover:not(:disabled){background:oklch(0.97 0.01 290 / .12)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,var(--accent),var(--accent-2));border-color:transparent;color:var(--accent-ink);box-shadow:0 10px 30px oklch(0.72 0.17 55 / .35);padding:0 26px}
.btn.primary:hover:not(:disabled){transform:translateY(-1px);background:linear-gradient(180deg,oklch(0.87 0.14 75),var(--accent))}
.btn.primary:disabled{box-shadow:none;background:oklch(0.97 0.01 290 / .14);color:var(--ink-2)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover:not(:disabled){background:oklch(0.97 0.01 290 / .07);color:var(--ink)}
.btn.sm{min-height:34px;padding:0 14px;font-size:13.5px}
.btn.ok{background:var(--ok-soft);border-color:oklch(0.82 0.14 158 / .4);color:var(--ok)}
.btn svg{width:16px;height:16px}
.hint-err{color:var(--err);font-size:13.5px;margin:8px 0 0;min-height:20px}

.field{margin:0 0 18px}
.field label,.field .fl{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin:0 0 7px;letter-spacing:.01em}
.input{width:100%;min-height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line-2);background:oklch(0.11 0.035 288 / .7);color:var(--ink);font-size:15.5px;transition:border-color .2s,box-shadow .2s}
.input::placeholder{color:oklch(0.62 0.03 290)}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px oklch(0.83 0.15 72 / .18)}
.input[aria-invalid="true"]{border-color:var(--err)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line-2);background:oklch(0.97 0.01 290 / .05);cursor:pointer;font-size:14px;font-weight:550;color:var(--ink-2);transition:all .2s var(--ease)}
.chip:hover{color:var(--ink);background:oklch(0.97 0.01 290 / .1)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.avatars{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.av{aspect-ratio:1;border-radius:14px;border:1px solid var(--line-2);background:oklch(0.97 0.01 290 / .05);display:grid;place-items:center;cursor:pointer;padding:0;transition:all .2s var(--ease)}
.av svg{width:58%;height:58%}
.av[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px oklch(0.83 0.15 72 / .2)}
.folder{display:flex;gap:10px;align-items:center}
.folder code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:12px 12px;border-radius:12px;background:oklch(0.11 0.035 288 / .7);border:1px solid var(--line)}
.preview{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:oklch(0.11 0.035 288 / .7);border:1px solid var(--line);max-width:300px}
.preview .pav{width:38px;height:38px;border-radius:11px;background:var(--accent-soft);display:grid;place-items:center;flex:none}
.preview .pav svg{width:22px;height:22px}
.preview b{display:block;font-size:14.5px}
.preview span{font-size:12px;color:var(--ink-3)}

/* list rows (system check, run) */
.rows{display:flex;flex-direction:column;gap:10px}
.rowi{display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:14px;background:oklch(0.97 0.01 290 / .045);border:1px solid var(--line)}
.rowi.appear{animation:sceneIn .6s var(--ease) both}
.rowi .dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;background:oklch(0.97 0.01 290 / .08);color:var(--ink-3)}
.rowi .dot svg{width:15px;height:15px}
.rowi.ok .dot{background:var(--ok-soft);color:var(--ok)}
.rowi.bad .dot{background:oklch(0.78 0.13 25 / .16);color:var(--err)}
.rowi.busy .dot{background:var(--accent-soft);color:var(--accent)}
.rowi .t{flex:1;min-width:0}
.rowi .t b{display:block;font-weight:600;font-size:15px}
.rowi .t span{display:block;font-size:13px;color:var(--ink-3)}
.rowi .st{font-size:13px;font-weight:600;white-space:nowrap}
.rowi.ok .st{color:var(--ok)} .rowi.bad .st{color:var(--err)} .rowi.busy .st{color:var(--accent)}
.spinner{width:15px;height:15px;border-radius:50%;border:2px solid oklch(0.83 0.15 72 / .3);border-top-color:var(--accent);animation:spin .9s linear infinite}

.bar{height:6px;border-radius:6px;background:oklch(0.97 0.01 290 / .1);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent-2),var(--accent));border-radius:6px;transition:width .4s linear}

.list-plain{margin:0 0 6px;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.list-plain li{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:14px;background:oklch(0.97 0.01 290 / .045);border:1px solid var(--line);font-weight:550}
.list-plain li svg{width:18px;height:18px;color:var(--accent);flex:none}

.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.card{padding:16px;border-radius:16px;background:oklch(0.97 0.01 290 / .045);border:1px solid var(--line)}
.card svg.mini{width:100%;height:92px;display:block;margin-bottom:10px}
.card p{font-size:13.5px;color:var(--ink-2);margin:0}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{padding:14px;border-radius:16px;background:oklch(0.97 0.01 290 / .045);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.tile.ready{border-color:oklch(0.82 0.14 158 / .45);background:oklch(0.82 0.14 158 / .07)}
.tile header{display:flex;align-items:center;gap:10px}
.tile header .lg{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:oklch(0.97 0.01 290 / .08);font-weight:700;font-size:13px}
.tile header b{flex:1;font-size:14.5px}
.tag{font-size:12px;font-weight:650;padding:3px 9px;border-radius:999px;white-space:nowrap}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.warn{background:var(--accent-soft);color:var(--accent)} .tag.off{background:oklch(0.97 0.01 290 / .08);color:var(--ink-3)}
.tile .hint{font-size:12.5px;color:var(--ink-2)}
.tile .hint code{font-size:12px}
.reviewer{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:12.5px;color:var(--ink-3);padding:8px 12px;border-radius:10px;border:1px dashed var(--line-2);width:fit-content}
.reviewer input{accent-color:oklch(0.83 0.15 72);width:16px;height:16px}
.empty{padding:18px;border-radius:16px;border:1px dashed var(--line-2);margin-bottom:12px}
.empty b{display:block;font-size:16px;margin-bottom:4px}

/* sub stepper */
.sub{display:flex;gap:6px;margin:0 0 18px;padding:0;list-style:none}
.sub li{flex:1;font-size:12px;font-weight:600;color:var(--ink-3);padding-top:8px;border-top:3px solid var(--line-2);transition:all .4s var(--ease)}
.sub li.on{color:var(--ink);border-color:var(--accent)}
.sub li.done{color:var(--ok);border-color:var(--ok)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;border:1px solid var(--line-2);background:oklch(0.97 0.01 290 / .045);cursor:pointer;text-align:left;width:100%}
.opt:hover{background:oklch(0.97 0.01 290 / .09)}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt .rd{width:18px;height:18px;border-radius:50%;border:2px solid var(--ink-3);flex:none;display:grid;place-items:center}
.opt[aria-checked="true"] .rd{border-color:var(--accent)}
.opt[aria-checked="true"] .rd::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
.opt b{display:block;font-size:14.5px} .opt span{font-size:12.5px;color:var(--ink-3)}
.steps-ol{margin:0 0 14px;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.steps-ol li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:oklch(0.97 0.01 290 / .045);border:1px solid var(--line)}
.steps-ol li::before{content:counter(s);width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12.5px;display:grid;place-items:center;flex:none}
.steps-ol li.did::before{content:"✓";background:var(--ok-soft);color:var(--ok)}
.steps-ol .c{flex:1;min-width:0}
.steps-ol .c > div{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.diagram{width:100%;height:auto;display:block;margin:4px 0 14px}
.connected{display:flex;gap:10px;align-items:center;color:var(--ok);font-weight:650}

/* permissions */
.perm{display:grid;grid-template-columns:1fr;gap:12px;align-items:center;padding:14px 16px;border-radius:14px;background:oklch(0.97 0.01 290 / .045);border:1px solid var(--line);margin-bottom:10px}
.perm b{display:block;font-size:15px} .perm span{font-size:12.5px;color:var(--ink-3)}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:oklch(0.11 0.035 288 / .8);border:1px solid var(--line)}
.seg button{min-height:34px;padding:0 12px;border-radius:999px;border:0;background:transparent;color:var(--ink-2);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.seg button[aria-checked="true"]{background:var(--ink);color:var(--bg)}
.seg button[aria-checked="true"][data-v="never"]{background:var(--err);color:oklch(0.2 0.04 25)}
.seg button[aria-checked="true"][data-v="ask"]{background:var(--accent);color:var(--accent-ink)}

/* first run */
.runs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.runc{padding:14px;border-radius:16px;border:1px solid var(--line-2);background:oklch(0.97 0.01 290 / .045);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:112px}
.runc:hover:not(:disabled){background:oklch(0.97 0.01 290 / .09)}
.runc[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.runc:disabled{cursor:not-allowed;opacity:.55}
.runc svg{width:24px;height:24px;color:var(--accent)}
.runc b{font-size:14.5px;line-height:1.25}
.pipe{display:flex;align-items:center;gap:0;margin:6px 0 14px}
.node{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12px;color:var(--ink-3);position:relative}
.node i{width:38px;height:38px;border-radius:12px;border:1px solid var(--line-2);background:oklch(0.11 0.035 288 / .8);display:grid;place-items:center;transition:all .5s var(--ease)}
.node i svg{width:18px;height:18px}
.node.on i{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);box-shadow:0 0 22px oklch(0.83 0.15 72 / .6)}
.node.on{color:var(--ink)}
.node.done i{background:var(--ok-soft);color:var(--ok);border-color:oklch(0.82 0.14 158 / .5)}
.node.done{color:var(--ink-2)}
.link{height:2px;flex:.5;background:var(--line-2);margin-bottom:22px}
.link.on{background:var(--accent)}
.result{padding:16px;border-radius:16px;background:oklch(0.11 0.035 288 / .7);border:1px solid oklch(0.82 0.14 158 / .35);animation:sceneIn .7s var(--ease) both}
.result h2{color:var(--ok);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.result p{font-size:14px;color:var(--ink-2);margin:0 0 6px}

/* finish */
.sum{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin:0 0 22px;padding:0;list-style:none}
.sum li{display:flex;align-items:center;gap:10px;font-size:14px;padding:6px 0;border-bottom:1px solid var(--line)}
.sum li .s{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex:none}
.sum li .s svg{width:12px;height:12px}
.sum li.done .s{background:var(--ok-soft);color:var(--ok)}
.sum li.skipped .s{border:1.5px dashed var(--skip);color:var(--skip)}
.sum li .n{flex:1}
.sum li em{font-style:normal;font-size:12px;color:var(--skip);font-weight:600}
.sum a{color:var(--accent);font-size:12.5px;font-weight:600;text-underline-offset:3px}
.cat{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.cat > div{display:flex;gap:11px;align-items:flex-start;padding:12px;border-radius:14px;background:oklch(0.97 0.01 290 / .045);border:1px solid var(--line)}
.cat svg{width:20px;height:20px;color:var(--accent);flex:none;margin-top:2px}
.cat b{display:block;font-size:14px}
.cat span{display:block;font-size:12.5px;color:var(--ink-2);line-height:1.35}
.cat small{display:block;font-size:11.5px;color:var(--ink-3);margin-top:3px;letter-spacing:.02em}
.h3{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px;font-weight:650}

/* mockup control */
.mock{position:fixed;right:16px;bottom:16px;z-index:10}
.mock > button{min-height:34px;padding:0 14px;border-radius:999px;border:1px dashed var(--line-2);background:oklch(0.12 0.04 288 / .9);color:var(--ink-2);font-size:12.5px;font-weight:600;cursor:pointer}
.mock .pop{position:absolute;right:0;bottom:44px;width:240px;padding:14px;border-radius:16px;background:oklch(0.14 0.04 288 / .97);border:1px solid var(--line-2);box-shadow:0 20px 60px oklch(0.05 0.03 285 / .7)}
.mock .pop[hidden]{display:none}
.mock .pop p{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
.mock .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.mock .grid button{min-height:34px;border-radius:9px;border:1px solid var(--line-2);background:oklch(0.97 0.01 290 / .05);cursor:pointer;font-weight:650}
.mock .grid button[aria-current="step"]{background:var(--ink);color:var(--bg)}
.final{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:oklch(0.10 0.04 285 / .8);backdrop-filter:blur(8px)}
.final[hidden]{display:none}
.final > div{max-width:420px;text-align:center;padding:30px;border-radius:22px;background:var(--glass);border:1px solid var(--line-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:1120px){ .journey .lbl{display:none} }
@media (max-width:1000px){
  :root{--pl:16px}
  .app{padding:14px 16px 16px}
  .brand small{display:none}
  .panel-body{padding:26px 22px 14px}
  .panel-foot{padding:14px 16px 16px 22px}
  .runs,.perm,.list-plain,.two,.tiles,.choice,.cat,.row2{grid-template-columns:1fr}
  .seg{justify-self:start}
}
.bmark{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;flex:none;font-weight:800;font-size:13px;color:oklch(0.15 0.03 290)}
.opt .tag{display:inline-block;margin-top:3px}
.subback{background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;text-align:left}
.subback:hover{text-decoration:underline;text-underline-offset:3px}
/* ---------- life: inhabitants, build events, discoveries ---------- */
.app{pointer-events:none}
.app .top,.app .panel{pointer-events:auto}
#world [data-hit],#vsvg [data-hit]{pointer-events:all;cursor:pointer}
#vsvg .plot:not(.built) [data-hit]{pointer-events:none}

.a-hammer{animation:hamm .42s ease-in infinite alternate}
@keyframes hamm{from{transform:rotate(-165deg)}to{transform:rotate(-45deg)}}
.a-wave{animation:waveA .42s ease-in-out infinite alternate}

.a-gest{animation:gest 1.1s ease-in-out infinite alternate}
.a-gest.d2{animation-delay:-.7s}
@keyframes gest{from{transform:rotate(-15deg)}to{transform:rotate(-65deg)}}
.a-letter{animation:letA 3s ease-in-out infinite}
@keyframes letA{0%,100%{transform:rotate(-30deg)}25%,60%{transform:rotate(-82deg)}}
.letter{animation:letter 3s ease-in-out infinite}
@keyframes letter{0%,25%{transform:translateX(0);opacity:1}55%{transform:translateX(8px);opacity:1}70%,100%{transform:translateX(8px);opacity:0}}
.drop{animation:drop .9s linear infinite}
.drop.d2{animation-delay:-.3s}.drop.d3{animation-delay:-.6s}
@keyframes drop{from{transform:translateY(0);opacity:1}to{transform:translateY(11px);opacity:0}}
.bobber{animation:bobber 2.2s ease-in-out infinite}
@keyframes bobber{0%,100%{transform:translateY(0)}50%{transform:translateY(1.6px)}}
.bub{opacity:0;pointer-events:none !important;animation:bubA 4s steps(1,end) infinite}
.bub.bB{animation-delay:-2s}
@keyframes bubA{0%{opacity:1}50%{opacity:0}}
.warm{animation:warmh 2.6s ease-in-out infinite alternate}
@keyframes warmh{from{transform:rotate(-40deg)}to{transform:rotate(-58deg)}}
/* build-event workers */
.carry .arm{animation:none;transform:rotate(180deg)}
.hammer .arm.a{animation:hamm .26s ease-in infinite alternate}
.hammer .arm.b{animation:none;transform:rotate(-20deg)}
.hammer .leg,.cheerw .leg{animation:none}
.hammer .load,.cheerw .load{display:none}
.cheerw .arm{animation:waveA .3s ease-in-out infinite alternate}
/* discoveries */
.sails{transform-box:fill-box;transform-origin:center}
.wv{display:none}.lit2 .wv{display:inline}
.w2{opacity:0;transition:opacity .4s}.lit2 .w2{opacity:1}
.cat{display:none}.hascat .cat{display:inline}
.tail{transform-box:fill-box;transform-origin:0 100%;animation:tail 1.6s ease-in-out infinite alternate}
@keyframes tail{from{transform:rotate(-14deg)}to{transform:rotate(18deg)}}
.fl{transform-box:fill-box;transform-origin:center;transition:transform .7s var(--ease)}
.bloomed .fl{transform:scale(1.8)}
.fire{transform-box:fill-box;transform-origin:50% 100%;transition:transform .3s var(--ease)}
.flare .fire{transform:scale(1.45)}
.flare .flick{animation-duration:.2s}
.fireglow{opacity:0;transition:opacity .3s}.flare .fireglow{opacity:1}
.ffly{animation:ffly var(--ft,4s) ease-in-out infinite alternate}
@keyframes ffly{from{transform:translate(0,0)}to{transform:translate(var(--fx),var(--fy))}}
.jlight{opacity:.35}.open .jlight{opacity:1}.open .lid{transform:translate(4px,-3px) rotate(30deg)}
.prop{transform-box:fill-box;transform-origin:center;animation:prop .12s linear infinite alternate}
@keyframes prop{from{transform:scaleX(1)}to{transform:scaleX(.2)}}
.dancing .lm{animation:waveA .3s ease-in-out infinite alternate}
.wb .a-gest{animation-name:waveA;animation-duration:.38s}
.found{position:fixed;right:108px;bottom:18px;z-index:10;min-height:34px;display:flex;align-items:center;padding:0 14px;border-radius:999px;background:oklch(0.14 0.04 288 / .9);border:1px solid var(--line-2);font-size:12.5px;color:var(--ink-2);pointer-events:none}
.found b{color:var(--accent);margin:0 .3em}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
  #vcam{transform:none !important}
  .wb .a-gest,.dancing .lm{transform:rotate(180deg) !important}
}

/* ---------- state ---------- */
let S, timers = [];
function fresh(){
  return {
    step:0, status:Array(10).fill(null),
    sys:{started:false, shown:0, checked:0, mono:"missing", svc:"off", monoMsg:"", svcMsg:""},
    prof:{name:"", icon:0, touched:false},
    about:{name:"", role:"", company:"", help:[]},
    mm:{phase:"idle", line:0},
    ag:{phase:"idle", none:false, sets:null},
    br:{sub:0, browser:null, opened:false, dev:false, copied:false, copiedUrl:false, pair:"idle", bprof:null},
    perm:{read:"allow", click:"allow", submit:"ask"},
    run:{pick:null, phase:"idle", node:-1}
  };
}
function agentSets(){
  return {
    normal:{
      claude:{inst:true, signed:true, busy:""},
      codex:{inst:true, signed:false, busy:""},
      opencode:{inst:false, signed:false, busy:""},
      copilot:{inst:false, signed:false, busy:""}
    },
    none:{
      claude:{inst:false, signed:false, busy:""},
      codex:{inst:false, signed:false, busy:""},
      opencode:{inst:false, signed:false, busy:""},
      copilot:{inst:false, signed:false, busy:""}
    }
  };
}
function later(ms, fn){ const t = setTimeout(() => { timers = timers.filter(x => x !== t); fn(); }, ms); timers.push(t); return t; }
function profileName(){ return S.prof.name.trim() || "your profile"; }
function nameError(){
  const n = S.prof.name.trim();
  if (!n) return "Give your profile a name.";
  if (n.toLowerCase() === "default") return "Pick a name that says what this profile is for.";
  return "";
}
function slug(n){ return (n.trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "")) || "<name>"; }
function activeAgents(){ return S.ag.none ? S.ag.sets.none : S.ag.sets.normal; }

function canNext(i){
  switch(i){
    case 1: return S.sys.checked >= 4 && S.sys.mono === "ok" && S.sys.svc === "ok";
    case 2: return !nameError();
    case 4: return S.mm.phase === "ok";
    case 5: return S.ag.phase === "done" && Object.values(activeAgents()).some(a => a.inst && a.signed);
    case 6: return !!S.br.bprof;
    case 8: return S.run.phase === "done";
    default: return true;
  }
}
function say(msg){ const l = $("#live"); l.textContent = ""; setTimeout(() => { l.textContent = msg; }, 30); }

/* ---------- journey / world ---------- */
function renderJourney(){
  const ol = $("#journey");
  ol.innerHTML = NAMES.map((n, i) => {
    const st = S.status[i], cur = i === S.step;
    const cls = [st || "", cur ? "current" : ""].join(" ").trim();
    const inner = cur ? String(i + 1) : st === "done" ? ic("check") : st === "skipped" ? ic("skip") : String(i + 1);
    const word = cur ? "current" : st === "done" ? "done" : st === "skipped" ? "skipped" : "upcoming";
    return `<li class="${cls}"${cur ? ' aria-current="step"' : ""}><span class="star" role="img" aria-label="Step ${i + 1}, ${esc(n)}: ${word}">${inner}</span><span class="lbl" aria-hidden="true">${esc(n)}${st === "skipped" && !cur ? "<em>Skipped</em>" : ""}</span></li>`;
  }).join("");
  $("#wire").style.width = (S.step / 9 * 100) + "%";
}
function makeStars(){
  const g = $("#stars"); let h = "";
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  for (let i = 0; i < 140; i++){
    const x = rnd() * 1600, y = rnd() * 640, r = rnd() < .9 ? rnd() * 1.3 + .4 : rnd() * 1.4 + 1.6;
    const tw = rnd() < .18;
    h += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r.toFixed(2)}" fill="oklch(0.95 0.02 290)" opacity="${(.35 + rnd() * .6).toFixed(2)}"${tw ? ` class="twinkle" style="animation-delay:${(-rnd() * 5).toFixed(2)}s"` : ""}/>`;
  }
  g.innerHTML = h;
}

/* ---------- render ---------- */
function render(changed){
  const i = S.step, body = $("#body");
  const fid = document.activeElement && document.activeElement.id;
  const scroll = body.scrollTop;
  body.innerHTML = `<div class="${changed ? "scene-in" : ""}"><p class="eyebrow">Step ${i + 1} of 10 · ${esc(NAMES[i])}</p>${STEPS[i].view()}</div>`;
  if (STEPS[i].bind) STEPS[i].bind(body);
  if (changed) body.scrollTop = 0; else body.scrollTop = scroll;
  updateFoot();
  renderJourney(); renderWorld();
  if (!changed && fid){ const el = document.getElementById(fid); if (el) el.focus({preventScroll:true}); }
  if (changed){ const h = $("#stepTitle"); if (h) h.focus({preventScroll:true}); }
}
function refresh(){ render(false); }
function updateFoot(){
  const i = S.step;
  const back = $("#back"), skip = $("#skip"), next = $("#next");
  back.style.visibility = i === 0 ? "hidden" : "visible";
  skip.hidden = !SKIPPABLE[i];
  next.textContent = i === 0 ? "Get started" : i === 2 ? "Create profile" : i === 9 ? "Open MonoAgent" : "Continue";
  next.disabled = !canNext(i);
}
function go(i){
  S.step = Math.max(0, Math.min(9, i));
  if (STEPS[S.step].enter) STEPS[S.step].enter();
  render(true);
  say(`Step ${S.step + 1} of 10: ${NAMES[S.step]}`);
}
function next(){
  const i = S.step;
  if (!canNext(i)){
    if (i === 2){ S.prof.touched = true; refresh(); const n = $("#pname"); if (n) n.focus(); }
    return;
  }
  const was = S.status[i];
  S.status[i] = "done";
  if (i === 9){ renderJourney(); $("#final").hidden = false; $("#finalClose").focus(); return; }
  go(i + 1);
  if (was !== "done") buildEvent(i + 1);
}
function skip(){ if (!SKIPPABLE[S.step]) return; S.status[S.step] = "skipped"; go(S.step + 1); }

function initMock(){
  $("#mockGrid").innerHTML = NAMES.map((n, i) => `<button type="button" data-j="${i}" title="${esc(n)}">${i + 1}</button>`).join("");
  $("#mockBtn").addEventListener("click", () => {
    const p = $("#mockPop"), open = p.hidden; p.hidden = !open; $("#mockBtn").setAttribute("aria-expanded", String(open)); markMock();
  });
  $("#mockGrid").addEventListener("click", e => { const b = e.target.closest("button[data-j]"); if (b) { go(+b.dataset.j); markMock(); } });
  $("#mockReset").addEventListener("click", () => { reset(); markMock(); });
  $("#mockAll").addEventListener("click", () => { for (let k = 0; k < 9; k++) S.status[k] = "done"; go(9); markMock(); });
  $("#finalClose").addEventListener("click", () => { $("#final").hidden = true; $("#next").focus(); });
}
function markMock(){ $$("#mockGrid button").forEach(b => b.toggleAttribute("aria-current", +b.dataset.j === S.step) || b.removeAttribute("aria-current")); $$("#mockGrid button").forEach(b => { if (+b.dataset.j === S.step) b.setAttribute("aria-current","step"); }); }
function reset(){ timers.forEach(clearTimeout); timers = []; lifeReset(); S = fresh(); S.ag.sets = agentSets(); $("#final").hidden = true; go(0); }

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#mockPop").hidden){ $("#mockPop").hidden = true; $("#mockBtn").setAttribute("aria-expanded","false"); $("#mockBtn").focus(); return; }
  if (e.key !== "Enter" || e.isComposing || e.shiftKey || e.metaKey || e.ctrlKey || e.altKey) return;
  if (!$("#final").hidden) return;
  const t = e.target, tag = t.tagName;
  if (tag === "BUTTON" || tag === "A" || tag === "TEXTAREA" || tag === "SELECT") return;
  if (tag === "INPUT" && t.type !== "text") return;
  if (t.closest && t.closest(".mock")) return;
  e.preventDefault();
  next();
});

const SYS_ROWS = [
  {k:"cli", t:"MonoAgent command line"},

function sysTick(){
  const s = S.sys;
  if (s.shown >= 4) return;
  s.shown++; if (S.step === 1) refresh();
  later(650, () => { s.checked++; if (S.step === 1) refresh(); sysTick(); });
}
function simSteps(lines, total, onLine, onDone){
  const per = total / lines.length;
  lines.forEach((l, k) => later(per * k, () => onLine(l, k)));
  later(total, onDone);
}
STEPS[1] = {
  enter(){ if (!S.sys.started){ S.sys.started = true; later(400, sysTick); } },
  view(){
    const s = S.sys;
    const rows = SYS_ROWS.slice(0, s.shown).map((r, k) => {
      let cls = "busy", st = `<span class="spinner" aria-hidden="true"></span>`, label = "Checking", act = "", d = r.d ? `<span>${r.d}</span>` : "";
      if (k < s.checked){
        if (r.k === "cli" || r.k === "node"){ cls = "ok"; label = "Found"; st = ic("check"); }
        if (r.k === "mono"){
          if (s.mono === "missing"){ cls = "bad"; label = "Not installed"; st = ic("x"); act = `<button class="btn sm" id="monoInstall" type="button">Install</button>`; }
          else if (s.mono === "busy"){ cls = "busy"; label = "Installing"; d = `<span>${esc(s.monoMsg)}</span>`; }
          else { cls = "ok"; label = "Installed"; st = ic("check"); }
        }
        if (r.k === "svc"){
          if (s.svc === "off"){ cls = "bad"; label = "Not running"; st = ic("x"); act = `<button class="btn sm" id="svcStart" type="button">Start</button>`; }
          else if (s.svc === "busy"){ cls = "busy"; label = "Starting"; d = `<span>${esc(s.svcMsg)}</span>`; }
          else { cls = "ok"; label = "Running"; st = ic("check"); }
        }
      }
      return `<div class="rowi ${cls}${k === s.shown - 1 && k >= s.checked ? " appear" : ""}"><span class="dot">${st}</span><div class="t"><b>${r.t}</b>${d}</div>${act || `<span class="st">${label}</span>`}</div>`;
    }).join("");
    const all = canNext(1);
    return `${H("System check")}
      <p class="lead">MonoAgent needs a few things on this machine.</p>

};

function agentTile(a){

function placeTag(){
  const tag = $("#planTag"), i = S.step, p = PLOTS[i];
  const txt = i === 9 ? "Your village is alive" : `Step ${i + 1} builds ${p.t}`;
  const t = $("#planTag text"); t.textContent = txt;
  let w = 220; try { w = t.getComputedTextLength() + 28; } catch (e) {}
  $("#planTag rect").setAttribute("width", w.toFixed(0));
  let minX = 4;
  try {
    const svg = $("#vsvg"), m = svg.getScreenCTM().inverse(), pt = svg.createSVGPoint();
    pt.x = $(".panel").getBoundingClientRect().right + 10; pt.y = 0;
    minX = Math.max(4, pt.matrixTransform(m).x);
  } catch (e) {}
  const x = Math.max(minX, Math.min(896 - w, p.x - w / 2)), y = p.y - 34;
  tag.style.transform = `translate(${x}px, ${y}px)`;
  tag.setAttribute("opacity", "1");
}
function renderWorld(){
  const cur = S.step; let n = 0; const built = new Set();
  $$("#vsvg .plot").forEach(g => {
    const s = +g.dataset.s, st = S.status[s - 1];
    const isB = (st === "done" || (s === 10 && cur === 9)) && !BUILDING.has(s);
    const plan = !isB && (s - 1 === cur || BUILDING.has(s));
    g.classList.toggle("built", isB);
    g.classList.toggle("plan", plan);
    g.classList.toggle("ghost", !isB && !plan && st === "skipped");
    if (isB){ n++; built.add(s); }
  });
  $$("#actors .actor").forEach(a => a.classList.toggle("on", built.has(+a.dataset.need)));
  $("#warmV").setAttribute("opacity", (n * 0.09).toFixed(2));
  $("#warmSky").setAttribute("opacity", (n * 0.06).toFixed(2));
  document.body.classList.toggle("dawn", cur === 9);
  placeTag();

    let h = "";
    for (let k = 0; k < 7; k++) h += `<ellipse class="lf" cx="${(262 + rand(-16, 16)).toFixed(1)}" cy="${(552 + rand(-14, 8)).toFixed(1)}" rx="2.6" ry="1.4" fill="oklch(${rand(.5, .72).toFixed(2)} 0.12 ${rand(60, 150).toFixed(0)})"/>`;
    h += `<path class="bd" d="M256 546 q3 -3.5 6 0 q3 -3.5 6 0" fill="none" stroke="oklch(0.22 0.05 300)" stroke-width="1.8" stroke-linecap="round"/>`;
    const g = addFx(h);
    g.querySelectorAll(".lf").forEach(l => anim(l, [{transform:"translate(0px,0px) rotate(0deg)", opacity:1},{transform:`translate(${rand(-22, 22)}px,${rand(30, 46)}px) rotate(${rand(-180, 180)}deg)`, opacity:0}], {duration:rand(1100, 1700), easing:"ease-in", fill:"forwards"}));
    anim(g.querySelector(".bd"), [{transform:"translate(0px,0px)"},{transform:"translate(190px,-180px) scale(.7)"}], {duration:1700, easing:"cubic-bezier(.4,0,.6,1)", fill:"forwards"});
    later(1750, () => g.remove());
    discover("tree");
  },
  flowers(h){ h.classList.add("bloomed"); discover("flowers"); },
  dance(h){
    if (!cool("dance", 2000)) return;
    const hop = h.querySelector(".hop"); hop.style.transformBox = "fill-box"; hop.style.transformOrigin = "50% 100%";
    anim(hop, [{transform:"rotate(0deg) translateY(0px)"},{transform:"rotate(-14deg) translateY(-4px)"},{transform:"rotate(14deg) translateY(0px)"},{transform:"rotate(-14deg) translateY(-4px)"},{transform:"rotate(0deg) translateY(0px)"}], {duration:900, iterations:2});
    h.classList.add("dancing"); later(1800, () => h.classList.remove("dancing"));
    discover("dance");
  },
  chat(h){ if (!cool("chat", 2700)) return; h.classList.add("wb"); later(2600, () => h.classList.remove("wb")); discover("wave"); },
  sky(h, e){
    if (!cool("sky", 700)) return;
    const p = vpt(e, $("#world"));
    const g = addFx(`<g transform="translate(${p.x.toFixed(0)} ${p.y.toFixed(0)})"><g class="ss"><line x1="0" y1="0" x2="80" y2="-34" stroke="url(#starG)" stroke-width="2.4" stroke-linecap="round"/><circle r="2.4" fill="oklch(0.98 0.03 90)"/></g></g>`, $("#wfx"));
    anim(g.querySelector(".ss"), [{transform:"translate(0px,0px)", opacity:0},{opacity:1, offset:.15},{transform:"translate(-260px,110px)", opacity:0}], {duration:1100, easing:"cubic-bezier(.3,.6,.4,1)", fill:"forwards"});
    later(1150, () => g.remove());
    discover("star");
  },
  river(h, e){
    if (!cool("river", 1300)) return;
    const p = vpt(e, $("#vcam"));
    const g = addFx(`<g transform="translate(${p.x.toFixed(1)} ${p.y.toFixed(1)})"><circle class="spl" r="3" fill="none" stroke="oklch(0.85 0.06 230)" stroke-width="1.2"/><path class="fish" d="M6 0 q-6 -5 -12 0 q6 5 12 0z M-5 0 l-5 -3.5 v7z" fill="oklch(0.74 0.13 45)"/></g>`);
    const f = g.querySelector(".fish");
    if (!anim(f, [{transform:"translate(0px,0px) rotate(-50deg)"},{transform:"translate(10px,-28px) rotate(0deg)", offset:.5},{transform:"translate(20px,2px) rotate(55deg)"}], {duration:900, easing:"ease-in-out", fill:"forwards"})) f.setAttribute("transform", "translate(10 -20)");
    anim(g.querySelector(".spl"), [{transform:"scale(1)", opacity:1},{transform:"scale(4)", opacity:0}], {duration:700, fill:"forwards"});
    later(1000, () => g.remove());
    discover("fish");
  },
  dome(){ if (stopFollow || !cool("dome", 1000)) return; startFollow(); discover("follow"); },
  jar(h){
    if (h.classList.contains("open")) return;
    h.classList.add("open");
    let s = "";
    for (let k = 0; k < 9; k++) s += `<circle class="ffly" style="--fx:${rand(-30, 30).toFixed(0)}px;--fy:${rand(-40, -5).toFixed(0)}px;--ft:${rand(2.5, 5).toFixed(1)}s;animation-delay:${(-rand(0, 4)).toFixed(1)}s" cx="${(792 + rand(-26, 26)).toFixed(0)}" cy="${(664 + rand(-40, 6)).toFixed(0)}" r="3.4" fill="url(#v-ffly)"/>`;
    addFx(s);
    discover("jar");
  }
};
function lifeReset(){
  if (stopFollow) stopFollow();
  BUILDING.clear(); EVENTS = 0; FOUND.clear(); roofN = 0;
  for (const k in COOL) delete COOL[k];
  const f = $("#found"); f.hidden = true; f.textContent = "";
  $("#fx").innerHTML = ""; $("#wfx").innerHTML = "";
  const cls = ["lit2","hascat","flare","bloomed","open","wb","dancing"];
  $$("#vsvg ." + cls.join(", #vsvg .")).forEach(e => e.classList.remove(...cls));
  const cam = $("#vcam"); cam.style.transform = ""; cam.classList.remove("cheer");
}
function initLife(){
  /* scene clicks never move focus away from the form */
  document.addEventListener("mousedown", e => { if (e.target.closest && e.target.closest("#village, #world")) e.preventDefault(); });
  document.addEventListener("click", e => {
    const h = e.target.closest && e.target.closest("[data-hit]");
    if (!h || !h.closest("#village, #world")) return;
    const f = HIT[h.dataset.hit]; if (f) f(h, e);
  });
}

/* ---------- init ---------- */
$("#back").addEventListener("click", () => go(S.step - 1));
$("#next").addEventListener("click", next);
$("#skip").addEventListener("click", skip);
buildVillage();
initLife();
window.addEventListener("resize", () => placeTag());
makeStars();
initMock();
reset();
</script>
</body>
</html>
