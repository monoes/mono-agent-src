name: CI

# push is limited to master: a branch with a PR already runs this workflow via
# pull_request, and running both on every commit doubled the queue (each commit
# ran all 10 jobs twice under the same check names).
on:
  push:
    branches: [master]
  pull_request:

# A newer commit on the same PR supersedes the older run. Only pull_request
# runs are cancelled: push runs get a group of their own (run_id), so neither
# a running nor a queued one is ever cancelled -- a cancelled Doctor smoke
# check blocks the master merge.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}


# Least privilege for every job: they only read the repository.
permissions:
  contents: read

# Runner routing. Jobs that need no sudo, apt, Chrome or docker run on the
# self-hosted runners named by the repository variable CI_RUNNER (a JSON array
# of labels), using
#   runs-on: ${{ fromJSON((((github.event_name == 'pull_request' && <head repo is this repo>) || github.event_name == 'push') && vars.CI_RUNNER) || '"ubuntu-latest"') }}
# The test is POSITIVE: self-hosted only for a pull request whose head
# repository is this repository, or for a push (the `on:` block above limits push
# to master, so no tag and no other branch). Everything else gets ubuntu-latest:
# a fork, a deleted fork (head.repo is null), tags, workflow_dispatch, schedule
# and anything unknown. release.yml stays on hosted runners. The release guard
# accepts a green push run as proof that the tests passed, so that proof now
# comes from the self-hosted runners; the trade-off was weighed in issue #1356
# (faster, no hosted queue; but a runner that executes merged code and keeps its
# state between runs). An unset or empty CI_RUNNER falls back to ubuntu-latest.
# KILL SWITCH: delete the CI_RUNNER variable (or set it to "ubuntu-latest",
# quotes included) and every job, push runs included, runs on hosted runners again.
# "Changed paths" routes the same way, so neither pull requests nor master pushes wait on a hosted slot for it. "Doctor smoke
# test" (a clean-machine proof; also the required check name) and "Release guard test" (needs `zip`) stay hosted.
# Everything else (apt, Chrome, macOS/Windows) stays on its hosted OS.
# Persistent runners keep their Go module cache, so setup-go in these jobs sets
# `cache: ${{ runner.environment == 'github-hosted' }}` (restoring the archive
# onto a populated read-only cache only prints thousands of "File exists").
#
# SECURITY (this repository is PUBLIC). The expression above protects only an
# UNMODIFIED workflow. A pull request runs the workflow file from ITS OWN merge
# ref, so a fork PR can edit this file and name the self-hosted labels itself.
# The only guard is the repository setting "Fork pull request workflows from
# outside collaborators: require approval for all external contributors"
# (check: gh api repos/monoes/mono-agent-src/actions/permissions/fork-pr-contributor-approval
# must say all_external_contributors). Whoever approves a fork PR run MUST read
# its diff first: if it touches .github/ or any script a job runs, approving
# hands a runner to the contributor. NEVER use pull_request_target or
# workflow_run here. .github/scripts/workflow-guard_test.sh fails CI if a
# workflow does either, or names self-hosted outside the CI_RUNNER variable.
#
# Path trimming. The `changes` job (.github/scripts/ci-changes.sh) works out
# which job groups a pull request can affect; push to master, and any change to
# a workflow, this script or go.mod/go.sum, runs everything. KILL SWITCH for
# trimming: set the repository variable CI_TRIM to `off` and every pull request
# runs everything too.

jobs:
  # Which parts of the repository a change touches. A plain `git diff --no-renames --name-only`
  # (so a rename lists BOTH paths: moving a .go file to notes.md must still run Go tests)
  # against the PR base, no third-party action. Only pull requests are trimmed:
  # push to master (the release guard needs a full green run) reports everything
  # as changed. If the diff cannot be computed the result is also "everything".
  changes:
    name: Changed paths
    runs-on: ${{ fromJSON((((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'push') && vars.CI_RUNNER) || '"ubuntu-latest"') }}
    timeout-minutes: 5
    outputs:
      go: ${{ steps.c.outputs.go }}
      wails: ${{ steps.c.outputs.wails }}
      extension: ${{ steps.c.outputs.extension }}
      nosocial: ${{ steps.c.outputs.nosocial }}
      account: ${{ steps.c.outputs.account }}
      docs_only: ${{ steps.c.outputs.docs_only }}
      ci_workflow: ${{ steps.c.outputs.ci_workflow }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compute changed paths
        id: c
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_TRIM: ${{ vars.CI_TRIM }}
        run: |
          files=""
          if [ "$EVENT" = pull_request ] && [ "$CI_TRIM" != off ]; then
            # An empty list (fetch or diff failed) means "everything" to the script.
            if git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null; then
              files="$(git diff --no-renames --name-only "$BASE_SHA" HEAD || true)"
            fi
          fi
          echo "changed files:"; echo "$files"
          printf '%s\n' "$files" | bash .github/scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"

  # Guards MA-04: .mcp.json must pin an exact Monomind version. A floating
  # `@latest`/caret/tilde reference means a future, unreviewed package
  # publish executes locally the next time this repo's MCP server starts.
  mcp-pin-guard:
    name: Guard .mcp.json version pin
    runs-on: ${{ fromJSON((((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'push') && vars.CI_RUNNER) || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject floating Monomind version
        run: |
          if grep -qE 'monomind(cli)?@(latest|\^|~)' .mcp.json; then
            echo "::error file=.mcp.json::Monomind must be pinned to an exact version (no @latest, ^, or ~)"
            exit 1
          fi
          if ! grep -q '@monoes/monomindcli@' .mcp.json; then
            echo "::error file=.mcp.json::.mcp.json must reference the canonical @monoes/monomindcli package"
            exit 1
          fi

  # Closes issue #23's CI gap: installs the exact Monomind version .mcp.json
  # pins and runs the real client/server handshake (internal/monomind
  # .Handshake), so a protocol/version mismatch between this repo and the
  # pinned Monomind release fails CI instead of surfacing as a runtime
  # error for users. See docs/plans/local-agent-monomind-delegation.md §11.
  monomind-smoke:
    name: Monomind integration smoke test
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install pinned Monomind version
        run: |
          version=$(grep -oE '@monoes/monomindcli@[0-9][0-9.]*' .mcp.json | cut -d@ -f3)
          if [ -z "$version" ]; then
            echo "::error file=.mcp.json::could not extract a pinned @monoes/monomindcli version"
            exit 1
          fi
          npm install -g "@monoes/monomindcli@${version}"
      - name: Run handshake smoke test
        run: MONOMIND_SMOKE=1 go test ./internal/monomind/... -run TestSmoke_RealMonomindHandshake -v
      # C-26 / C-13: every org config shape mono-agent writes (automations,
      # grants, tool providers, endpoint roles, holding orgs, federation,
      # autonomy) must pass the real `monomind org validate` and come out
      # byte-identical — a stricter monomind schema that dropped or rejected
      # these keys would otherwise go unnoticed.
      - name: Validate golden org configs with the real monomind
        run: |
          proj="$(mktemp -d)"
          mkdir -p "$proj/.monomind/orgs"
          cp testdata/orgs/*.json "$proj/.monomind/orgs/"
          for f in testdata/orgs/*.json; do
            name="$(basename "$f" .json)"
            (cd "$proj" && monomind org validate "$name")
            # Compare file by file: testdata/orgs also holds non-org
            # fixtures (runs/), which a directory diff would report.
            diff "$f" "$proj/.monomind/orgs/$(basename "$f")"
          done

  # Setup & health check (docs/plans/2026-09-24-setup-and-health-check.md):
  # runs the real `monoagentcli doctor` in a throwaway HOME and asserts its
  # JSON contract — schema v1, a required failure exits 1, `--fix` repairs
  # it over several passes, `doctor fix` streams NDJSON — so a change that
  # breaks what the GUI's System health section parses fails CI. doctor and
  # setup need a monoes.me sign-in, so the build has the devaccount tag: the
  # script runs the checks in the warn period and asserts the refusal after it.
  # Stays on a hosted runner on purpose: it proves doctor/setup on a CLEAN machine (a fresh VM with no toolchain, keychain or
  # leftovers), which a persistent self-hosted runner is not. Its job name is the required master-ruleset check: keep it.
  doctor-smoke:
    name: Doctor smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false # the explicit Go cache steps below replace it (see the Test shard jobs)
      # Go build + module cache for the (non-race) devaccount build, which compiled cold every run.
      # Restored on every run, saved only by a push to master (see the Test shard jobs).
      # Best-effort and time-boxed: this is the required check and its job limit is 10 minutes, so
      # the two cache steps may take 2 + 2 minutes at the very worst and a cold build still fits.
      - name: Work out the Go build cache key
        id: gocache
        env:
          GOSUM: ${{ hashFiles('go.sum') }}
        run: |
          prefix="gobuild-doctor-$(go env GOVERSION)-"
          {
            echo "dir=$(go env GOCACHE)"
            echo "mod=$(go env GOMODCACHE)"
            echo "prefix=$prefix"
            echo "key=${prefix}$(date -u +%Y-%j)-$GOSUM"
          } >> "$GITHUB_OUTPUT"
      - name: Restore the Go build cache
        id: gocache-restore
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gocache.outputs.dir }}
            ${{ steps.gocache.outputs.mod }}
          key: ${{ steps.gocache.outputs.key }}
          restore-keys: ${{ steps.gocache.outputs.prefix }}
      - name: Build monoagentcli
        run: go build -tags devaccount -o "$RUNNER_TEMP/monoagentcli" ./cmd/monoagentcli
      - name: Save the Go build cache (master push only)
        if: github.event_name == 'push' && steps.gocache-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 2
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gocache.outputs.dir }}
            ${{ steps.gocache.outputs.mod }}
          key: ${{ steps.gocache.outputs.key }}
      # Profile guard (scripts/lib/mono.sh): every scoped monoagentcli call in
      # these scripts must name its profile. They run each invocation through
      # mono_guard, which fails the script when stderr carries the gate's
      # "this command acts on a profile" warning, so a new script line that
      # forgets --profile turns this job red. The self-test proves the guard
      # itself still trips.
      - name: Profile guard self-test
        run: bash scripts/lib/mono-test.sh
      - name: Run doctor smoke test
        run: scripts/doctor-smoke.sh "$RUNNER_TEMP/monoagentcli"
      # The profile gate is enforced (no active profile, no fallback): a scoped
      # command with no --profile exits 3 and says to pass it, in the real
      # binary against a throwaway HOME. Regression test for the enforce flip.
      - name: Profile gate refuses a scoped command without --profile
        run: |
          home="$(mktemp -d)"
          code=0
          out="$(HOME="$home" USERPROFILE="$home" MONOAGENT_DEV_ENFORCE_FROM=2999-01-01T00:00:00Z \
            "$RUNNER_TEMP/monoagentcli" --db-path "$home/monoagent.db" people list 2>&1)" || code=$?
          echo "$out"
          [ "$code" -eq 3 ] || { echo "want exit 3, got $code"; exit 1; }
          echo "$out" | grep -q -- "pass --profile" || { echo "missing 'pass --profile' in the refusal"; exit 1; }
      - name: Run tasks MCP smoke test
        run: scripts/tasks-mcp-smoke.sh "$RUNNER_TEMP/monoagentcli"
      - name: Run agent eval reference self-test
        run: scripts/evals/run.sh --bin "$RUNNER_TEMP/monoagentcli" --reference

  # The mandatory monoes.me account (docs/mastermind/specs/2026-10-05-monoes-account-gate-design.md,
  # section 11): the real binary, built with the devaccount tag, against a fake monoes.me. Locked,
  # sign in, ok, blocked, unreachable, grace, expired, the warn period, every door and one operation
  # through every process type and entry point, so a path that forgot to install the guard fails here
  # and not for signed-in users. It must pass before release R.
  account-smoke:
    name: Account gate smoke (devaccount)
    needs: changes
    if: needs.changes.outputs.account == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Vet with the dev tag
        run: go vet -tags devaccount ./internal/account/... ./internal/accountsmoke/... ./cmd/monoagentcli/
      - name: Account tests with the dev tag
        run: go test -race -tags devaccount ./internal/account/... -count=1
      - name: Real-binary smoke
        # The runner's Ubuntu forbids the unprivileged user namespace Chrome's sandbox needs
        # (the zygote aborts), so the real-browser pairing test starts it with --no-sandbox.
        env:
          MONO_CHROME_NO_SANDBOX: "1"
        run: go test -tags devaccount ./internal/accountsmoke/ -count=1 -timeout 25m -v

  # An older release against a database that holds the peer-credential binding's v2 rows (scripts/procbind-old-binary-smoke.sh).
  # Hosted runner, no secrets, scratch HOME. Code changes only.
  procbind-old-binary-smoke:
    name: Previous-binary smoke (v0.193.5)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Download Go modules
        run: |
          for i in 1 2 3; do
            go mod download && exit 0
            sleep $((i*5))
          done
          echo "go mod download failed" >&2
          exit 1
      # Test-only build with the dev gate off; never uploaded and not part of any release artifact.
      - name: Build the new binary (devaccount, test only)
        run: go build -tags devaccount -o "$RUNNER_TEMP/monoagentcli-dev" ./cmd/monoagentcli
      # The checkout is shallow with no tags; the script builds the old release from its tag.
      # The job token (read-only) so this still works when the repository is private. The header is
      # masked and never traced; the script then finds the tag locally and needs no network.
      - name: Fetch the previous release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +x
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          for i in 1 2 3; do
            git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" fetch --depth=1 origin tag v0.193.5 && exit 0
            sleep $((i*5))
          done
          echo "could not fetch tag v0.193.5" >&2
          exit 1
      # The script builds the old tag and the seeder itself and uses a scratch HOME.
      - name: Previous release against a database holding v2 binding rows
        run: TMPDIR="$RUNNER_TEMP" bash scripts/procbind-old-binary-smoke.sh --new "$RUNNER_TEMP/monoagentcli-dev" --old-tag v0.193.5 --require-reachable

  # The release guard (scripts/check-release-tags.sh) keeps the devaccount tag out of releases: this
  # builds a tiny program with and without the tag, loose and inside a tarball and a zip, and checks
  # that the guard passes and fails as it should (spec D11, D24).
  # Stays on a hosted runner: its scripts need `zip` (check-release-tags-test.sh builds a .zip like the macOS app's), which our
  # self-hosted runners do not have (the first run there failed with `zip: command not found`).
  release-guard-test:
    name: Release guard test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Test the CI path rules
        run: bash .github/scripts/ci-changes_test.sh
      - name: Test the workflow security guard
        run: bash .github/scripts/workflow-guard_test.sh
      - name: Test the release guard's full-run check
        run: bash .github/scripts/ci-run-is-full_test.sh
      - name: Test the release guard's PR-run identity check
        run: bash .github/scripts/ci-run-matches-merge_test.sh
      - name: Test the internal/tasks heavy-test split
        run: bash .github/scripts/tasks-heavy-tests_test.sh
      - name: Test the package shard split
        run: bash .github/scripts/ci-rshard-packages_test.sh
      - name: Test the monoagentcli shard split
        run: bash .github/scripts/monoagentcli-shard_test.sh
      - name: Test the monoagentcli weights check
        run: bash .github/scripts/monoagentcli-weights-check_test.sh
      # Lists the test names only (nothing runs). Fails when a batch of new tests has no weight, which would unbalance a shard.
      - name: Check the monoagentcli test weights
        run: go test ./cmd/monoagentcli -list '^(Test|Example)' | bash .github/scripts/monoagentcli-weights-check.sh
      - name: Test the release guard
        run: bash scripts/check-release-tags-test.sh
      - name: Test the rollout guard
        run: bash scripts/check-rollout-ready-test.sh
      - name: Test the installer
        run: bash scripts/install-test.sh
      - name: Test the app version stamp
        run: bash scripts/stamp-app-version-test.sh


  # Closes issue #20's OpenAPI acceptance criterion ("OpenAPI 3 spec shipped
  # and validated in CI"): validates internal/httpapi/openapi.yaml against
  # the real OpenAPI 3.0 meta-schema (not just YAML syntax) so a hand-edited
  # spec that drifts into an invalid shape fails CI instead of only being
  # caught by a human reviewer. Pinned exact version — see mcp-pin-guard
  # above for why this repo never runs an unpinned npm package in CI.
  openapi-lint:
    name: Validate HTTP API OpenAPI spec
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ fromJSON((((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'push') && vars.CI_RUNNER) || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Lint OpenAPI spec against the OpenAPI 3 meta-schema
        run: npx --yes @redocly/cli@2.49.0 lint internal/httpapi/openapi.yaml

  # The Chrome extension ships in releases but no job built or exercised it,
  # so its JS was the one part of the repo nothing checked. node:test needs no
  # dependencies and no install step.
  extension-test:
    name: Chrome extension
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    # Hosted: the job drives headless Chrome with an extension service worker, so it runs on a hosted runner (ubuntu-latest).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Check every extension script parses
        run: find chrome-extension -name '*.js' -exec node --check {} +
      # An explicit glob, not the directory: Node 22 tries to load a bare
      # directory argument as a module ("Cannot find module …/chrome-extension")
      # where newer Node walks it. The glob must be '**' — a single '*' skips
      # chrome-extension/adapters/, silently running none of its tests.
      - name: Run extension tests
        run: |
          # `node --test` with a glob that matches nothing EXITS 0, so a typo in
          # the pattern below would silently run zero tests and still go green —
          # which is exactly how the adapters suite went unrun before. Assert a
          # floor first; the count only ever grows.
          count=$(find chrome-extension -name '*.test.mjs' | wc -l)
          if [ "$count" -lt 20 ]; then
            echo "::error::expected at least 20 extension test files, found $count"
            exit 1
          fi
          echo "running $count extension test files"
          node --test 'chrome-extension/**/*.test.mjs'

  # Scheduled + on-push dependency vulnerability scanning (MA-06/MA-11).
  vuln-scan:
    name: Vulnerability scan
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ${{ fromJSON((((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'push') && vars.CI_RUNNER) || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: govulncheck
        # Exact version, like every other tool CI runs (see mcp-pin-guard).
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: wails-app/frontend/package-lock.json
      - name: npm audit (frontend, production deps)
        # --omit=dev: the frontend's only current high-severity finding is an
        # esbuild/vite dev-server advisory (GHSA-67mh-4wv8-2f99) in build
        # tooling that never ships, and fixing it needs a breaking vite v8
        # bump — track it separately rather than gating CI on a dev-only
        # dependency. Production dependencies are audited at full severity.
        working-directory: wails-app/frontend
        run: npm audit --omit=dev --audit-level=high

  # INFORMATIONAL (continue-on-error): staticcheck's bug checks (SA*) and
  # unused code (U1000), so a self-comparison or a dropped error shows up in
  # review. Not a gate yet; pinned like every other tool.
  staticcheck:
    name: staticcheck (informational)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ fromJSON((((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'push') && vars.CI_RUNNER) || '"ubuntu-latest"') }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment == 'github-hosted' }}
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 -checks 'SA*,U1000' ./...

  # Issue #24: node schemas for a small, growing set of node types are
  # generated from `schema:"..."` struct tags (internal/tools/schemagen)
  # instead of hand-written. This regenerates just those files and fails if
  # the committed JSON drifts from what the generator produces — e.g.
  # someone hand-edited a generated schema file, or edited the struct tags
  # without re-running the generator. Deliberately scoped to only the node
  # types listed in internal/tools/schemagen.Manifest (see
  # internal/workflow/schemas/README.md) — most schema files are still
  # hand-written and are not touched by this check.
  schemagen-check:
    name: Generated node schemas up to date
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ fromJSON((((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'push') && vars.CI_RUNNER) || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: Check generated schemas match committed files
        run: go run ./cmd/schemagen -check

  # The suite under -race outgrew one 35-minute job on the hosted runners, so it
  # runs as shards: cmd/monoagentcli (most of the time) split by measured test weight into
  # four slices, everything else in "rest". The nosocial "rest" shard tests only
  # the packages with nosocial-tagged files (cmd/monoagentcli has some, so its
  # nosocial shards stay); "Build & test (nosocial)" builds and vets everything. "Build & test (default|nosocial)"
  # below stay the checks that gate a merge: they need every shard.
  test-shards:
    name: Test shard (${{ matrix.tags }} ${{ matrix.shard }})
    needs: changes
    # A job-level `if` cannot see the matrix, so the nosocial cells are skipped
    # step by step (a skipped cell still reports green after a few seconds).
    if: needs.changes.outputs.go == 'true'
    runs-on: ${{ fromJSON((((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'push') && vars.CI_RUNNER) || '"ubuntu-latest"') }}
    strategy:
      # On PR runs one failing shard cancels its queued and running siblings (the author fixes, then re-runs the failed jobs). Push runs (master, release) keep every shard running: a cancelled required check there blocks the merge and the release proof.
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        tags: [default, nosocial]
        # TEMPORARY: for tags=default the single `rest` cell is split into
        # r0..r3 (see the exclude/include below). Revert to restore it.
        shard: [rest, r0, r1, r2, r3, tp1, tp2, '0', '1', '2', '3']
        exclude:
          - { tags: default, shard: rest }
          - { tags: nosocial, shard: r0 }
          - { tags: nosocial, shard: r1 }
          - { tags: nosocial, shard: r2 }
          - { tags: nosocial, shard: r3 }
          - { tags: nosocial, shard: tp1 }
          - { tags: nosocial, shard: tp2 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: matrix.tags == 'default' || needs.changes.outputs.nosocial == 'true'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.tags == 'default' || needs.changes.outputs.nosocial == 'true'
        with:
          go-version-file: go.mod
          cache: false # the explicit Go cache steps below replace it (hosted); a persistent runner keeps its own

      # Go BUILD cache for the -race compile. actions/setup-go's own cache is OFF in this job: it
      # caches GOCACHE and GOMODCACHE under one key per go.sum, which holds whatever the first job
      # that missed had built (about 30 MB in the 2026-11-06 runs), is never refreshed, and is
      # saved from PR refs too (quota nobody else can read). This cache replaces it: the build
      # cache and the module cache, restored on every run (fork PRs too: they may read the base
      # branch's caches) and SAVED only by a push to master. One entry per (tags, class, Go
      # version, UTC day, go.sum): at most one fresh entry a day per class, so a day of master
      # pushes does not multiply the quota spend, and the entry is at most a day old. The class is
      # the set of shards that compile nearly the same thing: cmd/monoagentcli shards 0-3 (saved
      # by 0), r0-r3 (saved by r0; they share their dependency compiles), tp1+tp2 (saved by tp1);
      # the nosocial rest shard has its own. restore-keys fall back to the newest older entry.
      # Hosted runners only: a persistent runner keeps its own caches. Both steps are best-effort
      # (a cache outage must never fail a shard); the job has no timeout-minutes of its own
      # (GitHub's 360 minute default), so the 4 + 4 minute budgets fit.
      - name: Work out the Go build cache key
        id: gocache
        if: runner.environment == 'github-hosted' && (matrix.tags == 'default' || needs.changes.outputs.nosocial == 'true')
        env:
          SHARD: ${{ matrix.shard }}
          TAGS: ${{ matrix.tags }}
          GOSUM: ${{ hashFiles('go.sum') }}
        run: |
          case "$SHARD" in
            0 | 1 | 2 | 3) class=cli saver=0 ;;
            r0 | r1 | r2 | r3) class=r saver=r0 ;;
            tp1 | tp2) class=tp saver=tp1 ;;
            *) class="$SHARD" saver="$SHARD" ;;
          esac
          prefix="gobuild-race-$TAGS-$class-$(go env GOVERSION)-"
          {
            echo "dir=$(go env GOCACHE)"
            echo "mod=$(go env GOMODCACHE)"
            echo "prefix=$prefix"
            echo "key=${prefix}$(date -u +%Y-%j)-$GOSUM"
            echo "save=$([ "$SHARD" = "$saver" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: Restore the Go build cache
        id: gocache-restore
        if: steps.gocache.outputs.key != ''
        continue-on-error: true
        timeout-minutes: 4
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gocache.outputs.dir }}
            ${{ steps.gocache.outputs.mod }}
          key: ${{ steps.gocache.outputs.key }}
          restore-keys: ${{ steps.gocache.outputs.prefix }}

      - name: Test
        if: matrix.tags == 'default' || needs.changes.outputs.nosocial == 'true'
        env:
          SHARD: ${{ matrix.shard }}
          TAGS: ${{ matrix.tags }}
          # A restored build cache also holds test RESULTS; -count=1 makes every test really run, as on a cold hosted runner. A persistent runner keeps its own cache and its old behaviour.
          COUNT: ${{ runner.environment == 'github-hosted' && '-count=1' || '' }}
        run: |
          tags=""
          if [ "$TAGS" = nosocial ]; then tags="-tags nosocial"; fi
          # The heavy internal/tasks property tests have their own shards (tp1, tp2); every other shard skips them (.github/scripts/tasks-heavy-tests.txt).
          heavy="$(bash .github/scripts/tasks-heavy-tests.sh)"
          if [ "$SHARD" = rest ] && [ "$TAGS" = nosocial ]; then
            # The tag only changes packages that hold nosocial-tagged files;
            # the rest are already tested in the default shards. The list is
            # computed so it follows the files.
            pkgs="$(grep -rl --include='*.go' --exclude-dir=wails-app --exclude-dir=node_modules '//go:build.*nosocial' . | xargs -n1 dirname | sed 's|^\./||' | sort -u | grep -vx 'cmd/monoagentcli' | sed 's|^|./|' || true)"
            echo "nosocial packages: $pkgs"
            if [ -n "$pkgs" ]; then go test $COUNT -timeout 60m $tags $pkgs -race -skip "^($heavy)\$"; fi
          elif [ "$SHARD" = tp1 ] || [ "$SHARD" = tp2 ]; then
            go test $COUNT -timeout 60m $tags ./internal/tasks -race -run "^($(bash .github/scripts/tasks-heavy-tests.sh "$SHARD"))\$"
          elif [ "$SHARD" = rest ]; then
            go test $COUNT -timeout 60m $tags $(go list $tags ./... | grep -v -e '/cmd/monoagentcli$' -e '/internal/agentbox$') -race -skip "^($heavy)\$"
          elif [ "${SHARD#r}" != "$SHARD" ]; then
            # r0..r3: the packages are dealt out by measured weight (.github/scripts/ci-package-weights.txt), heaviest first, so no shard gets two of the long ones by chance.
            pkgs="$(go list $tags ./... | grep -v -e '/cmd/monoagentcli$' -e '/internal/agentbox$' | bash .github/scripts/ci-rshard-packages.sh "$SHARD" 4)"
            go test $COUNT -timeout 60m $tags $pkgs -race -skip "^($heavy)\$"
          else
            # Split by measured weight (.github/scripts/monoagentcli-test-weights.txt), not by position: every name lands in exactly one of the four shards.
            names="$(go test $tags ./cmd/monoagentcli -list '^(Test|Example)' | grep -E '^(Test|Example)' | bash .github/scripts/monoagentcli-shard.sh "$SHARD" 4)"
            go test $COUNT -timeout 70m $tags ./cmd/monoagentcli -race -run "^($names)$"
          fi

      - name: Save the Go build cache (master push only)
        if: github.event_name == 'push' && steps.gocache.outputs.save == 'true' && steps.gocache-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 4
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.gocache.outputs.dir }}
            ${{ steps.gocache.outputs.mod }}
          key: ${{ steps.gocache.outputs.key }}

  # internal/agentbox needs the real host root (its launcher check wants /usr/bin/bwrap
  # owned by uid 0, which a sandboxed local runner's user namespace shows as nobody)
  # and nested bwrap, so it is left out of the shards and runs here, ALWAYS on a
  # hosted runner: the fixed label keeps it off CI_RUNNER (workflow-guard_test.sh).
  # It is on the release proof list (ci-expected-shards.txt) like the shards.
  agentbox-test:
    name: Test agentbox (hosted)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -timeout 20m ./internal/agentbox -race

  # NOTE: no CGO_ENABLED=0 here. `go test -race` requires cgo ("go: -race
  # requires cgo" on Go 1.25), and ubuntu runners ship gcc — the default
  # CGO_ENABLED=1 works for modernc.org/sqlite and everything else we use.
  test:
    name: Build & test (default)
    needs: [changes, test-shards, agentbox-test]
    # Always reports (a skipped test-shards is a pass, a failed one fails the
    # first step), so the merge gate never waits on a trimmed job.
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON((((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'push') && vars.CI_RUNNER) || '"ubuntu-latest"') }}
    steps:
      - name: Fail if a test shard failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::a job this one needs failed or was cancelled"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.go == 'true'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.changes.outputs.go == 'true'
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: Build
        if: needs.changes.outputs.go == 'true'
        run: go build ./...

      - name: Vet
        if: needs.changes.outputs.go == 'true'
        run: go vet ./...

      # Vet type-checks the packages and their tests for the other release platforms without running anything (no cgo,
      # no Chrome). It replaces the darwin/windows vet of the removed "Doomsday tag" job: the open-ended mode's
      # platform-split files are part of the default tree now.
      - name: Vet for darwin/arm64 and windows/amd64
        if: needs.changes.outputs.go == 'true'
        run: |
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go vet ./...
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go vet ./...

      # CLAUDE.md lists `gofmt -l .` as a check, but nothing enforced it, so
      # five files had drifted out of gofmt shape on master. Listing files is
      # the whole check: gofmt -l prints the offenders and exits 0 either way,
      # so the emptiness of its output is what has to be asserted.
      - name: Formatting
        if: needs.changes.outputs.go == 'true'
        run: |
          unformatted="$(gofmt -l . | grep -v '^wails-app/frontend/node_modules/' || true)"
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-formatted — run: gofmt -w ."
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: echo "the tests ran in the Test shard jobs, which this job needs"

  # INFORMATIONAL (continue-on-error): runs internal/account's tests on Windows
  # and macOS, where no other job here does. The package has Windows-only code
  # (the LockFileEx file lock, the MOVEFILE_WRITE_THROUGH rename), and its Unix
  # code (flock, directory fsync) meets another kernel and filesystem on macOS.
  # Added without a way to run either OS's CI first, so a red first run must not
  # block a merge: the owner flips it to required (removes continue-on-error)
  # after the first green run. The tests swap in an in-memory keyring
  # (TestMain), so the real macOS Keychain and Windows Credential Manager are
  # not exercised. No -race: Windows may lack cgo, and the `test` job above
  # already runs this package under -race.
  account-os:
    name: Account package (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.account == 'true'
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./internal/account/... -count=1 -timeout 20m

      - name: Storage migration lock (Windows)
        if: runner.os == 'Windows'
        run: go test ./internal/storage/ -run 'TestLockFileEx|TestLockHolderHelper|TestApplyMigrationsConcurrentProcesses|TestRecordMigration|TestNewDatabaseGivesUpOnALockedDatabase|TestNewDatabaseRetriesBusyThenSucceeds' -count=1 -timeout 10m

  # Social platforms are built by default; this job keeps the opt-out
  # (-tags nosocial) build compiling and passing.
  test-nosocial:
    name: Build & test (nosocial)
    needs: [changes, test-shards]
    if: ${{ !cancelled() }}
    runs-on: ${{ fromJSON((((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'push') && vars.CI_RUNNER) || '"ubuntu-latest"') }}
    steps:
      - name: Fail if a test shard failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::a job this one needs failed or was cancelled"
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.go == 'true'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.changes.outputs.go == 'true'
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment == 'github-hosted' }}

      - name: Build
        if: needs.changes.outputs.go == 'true'
        run: go build -tags nosocial ./...

      - name: Vet
        if: needs.changes.outputs.go == 'true'
        run: go vet -tags nosocial ./...

      - name: Test
        run: echo "the tests ran in the Test shard jobs, which this job needs"

  # Mirror of the release.yml test gate's Wails steps (minus release/tagging):
  # system deps for GTK/WebKit headers, frontend build (main.go //go:embeds
  # frontend/dist — it must exist with content at compile time), then vet and
  # build the wails-app Go module. webkit2_41 tag because ubuntu-latest
  # (24.04) has no webkit2gtk-4.0 dev package.
  wails:
    name: Wails GUI module
    needs: changes
    if: needs.changes.outputs.wails == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: wails-app/go.mod

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev gcc pkg-config

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: 'npm'
          cache-dependency-path: wails-app/frontend/package-lock.json

      - name: Build frontend
        # npm/cli#7622 (npm ci hard-failing with EBADPLATFORM on optional
        # deps) was fixed by npm/cli#9262, shipped in npm 12.0.0
        # (2026-07-08). node-version above is 22 (bumped from 20) because
        # npm 12 requires Node >=22.22; Node 22's own bundled npm predates
        # 12, so it's installed explicitly too.
        run: |
          npm install -g npm@12
          npm ci
          npm run build
        working-directory: wails-app/frontend

      - name: Vet
        run: go vet -tags webkit2_41 ./...
        working-directory: wails-app

      - name: Build
        run: go build -tags webkit2_41 ./...
        working-directory: wails-app

      # The frontend's tests (render tests, locale parity, and the doctrine
      # check that no Wails binding imports internal/monomind) used to run
      # only at release, so a PR could break them unseen.
      - name: Test frontend
        run: npm test -- --run
        working-directory: wails-app/frontend

      - name: Test
        run: go test -tags webkit2_41 ./...
        working-directory: wails-app
